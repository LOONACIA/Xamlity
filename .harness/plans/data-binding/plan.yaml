id: data-binding
goal: >
  XAML의 `{Binding}`으로 요소 프로퍼티를 ViewModel(INotifyPropertyChanged)과 연결한다. FrameworkElement.DataContext 상속과 DataContextChanged,
  코드와 XAML 양쪽의 경로 바인딩(OneWay/TwoWay, 중첩 경로, DataContext 자체에 건 바인딩), IValueConverter, 바인딩 경고 로그,
  `{Binding}` 마크업 확장과 `<Binding>` 객체 요소, `{}` 이스케이프, clr-namespace xmlns 매핑(사용자 변환기·타입), x:DataType이 있을 때 임포트 시 경로 검증,
  참조한 스크립트 어셈블리가 바뀌면 XAML을 다시 임포트하는 의존성(ADR-003), XamlityRoot.DataContext와 Unity 콘솔 경고 연결을 만든다.
  ViewModel 값이 바뀌면 화면이 갱신되는 바인딩 샘플 씬이 보이면 완료다.
  ICommand(`Command="{Binding}"`, CanExecute에 따른 비활성화)는 Button이 있어야 하므로 컨트롤 계획으로 미룬다.
  {StaticResource}와 리소스, ElementName·RelativeSource·Source, StringFormat·FallbackValue·TargetNullValue, UpdateSourceTrigger, OneTime·OneWayToSource,
  MultiBinding, 검증(ValidationRule), 약한 이벤트, 다른 스레드의 PropertyChanged 처리, 핫리로드는 이 계획에 넣지 않는다.
  공통 규칙: 코드 식별자, 주석, 예외·오류·경고 메시지는 영어로 쓴다. Core 코드는 netstandard2.1 API와 C# 9 문법만 쓴다.
  지원하는 이름은 WPF와 같은 의미로 동작해야 하고, 지원하지 않는 값·문법은 조용히 무시하지 않고 오류로 알린다(ADR-004).
  모든 스텝은 dotnet test와 unity test를 둘 다 통과해야 한다. 기존 테스트의 기대값은 스텝 description이 요구사항 변경으로 명시한 것만 바꾼다.
  unity test 실행 중 Unity가 새 파일의 .meta를 만들며, 이 .meta 파일은 커밋 대상이므로 지우지 않는다.
approved: true
max_attempts: 3
ac_timeout_sec: 1200
steps:
  - id: s1-data-oneway-binding
    title: bind dependency properties one way to DataContext paths
    type: feat
    scope: data
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 7), docs/ADR.md (ADR-002, ADR-004, ADR-005, ADR-012),
      docs/ARCHITECTURE.md (Core 영역 표의 `Properties`·`Data`, 횡단 관심사 > 성능·스레드·리플렉션과 IL2CPP),
      unity/Packages/com.loonacia.xamlity/Core/Properties/*.cs, Core/Tree/UIElement.cs (AddVisualChild/RemoveVisualChild의 상속 부모 알림),
      Core/Tree/FrameworkElement.cs, Core/Controls/TextBlock.cs (Text는 AffectsMeasure|AffectsRender),
      dotnet/Xamlity.Core.Tests/Properties/DependencyPropertyTests.cs, dotnet/Xamlity.Core.Tests/Layout/GridTests.cs (할당 측정 방식).

      코드로 거는 OneWay 바인딩을 만든다. 소스는 DataContext뿐이다. XAML 문법은 s3, TwoWay·변환기·경고 로그는 s2다.

      1. Core/Properties:
         - `public delegate void DependencyPropertyChangedEventHandler(object sender, DependencyPropertyChangedEventArgs e);`
         - `public abstract class Expression` (생성자는 internal. Core 밖에서 파생하지 못하게). DependencyObject가 로컬 값 자리에 보관하는 식의 기반이다(WPF와 같은 구조).
           DependencyObject와의 내부 계약(이름은 자유): 붙을 때·떨어질 때 알림, 현재 값 조회, 대상 SetValue 가로채기(처리했으면 true).
           Properties가 Data를 참조하지 않도록 이 추상으로 분리한다. 이유: s2와 이후 계획(TemplateBinding 등)이 같은 저장 방식을 쓴다.
         - DependencyObject:
           - 로컬 값이 식이면 GetValue는 식의 현재 값(캐시)을 돌려준다. 식의 값이 `DependencyProperty.UnsetValue`면 메타데이터 기본값이다
             (상속값이 아님. WPF와 같음). 상속 조회 중 조상의 로컬 값이 식이어도 같은 규칙이다. 식 값 조회는 할당하지 않는다.
           - ReadLocalValue는 식 객체를 돌려준다(WPF와 같음).
           - 공개 SetValue에 Expression 인스턴스를 넘기면 ArgumentException. 식은 BindingOperations가 쓰는 internal 경로로만 설정한다.
           - 식이 있는 프로퍼티에 SetValue하면 식에 먼저 넘기고, 식이 처리하지 않으면(이 스텝의 바인딩은 모두 처리하지 않음) 식을 떼고
             새 값을 로컬 값으로 둔다(WPF: OneWay 바인딩은 SetValue로 대체된다). ClearValue는 식을 떼고 지운다.
           - 식을 설정·교체·제거할 때와 식의 값이 바뀔 때 일반 SetValue와 같은 변경 알림(PropertyChangedCallback, OnPropertyChanged로 인한 무효화,
             상속 자식 전파)을 낸다. 유효 값이 같으면(Equals) 알림 없음.
      2. FrameworkElement (WPF와 같은 이름):
         - `DataContextProperty` (object, 기본 null, FrameworkPropertyMetadataOptions.Inherits만. 레이아웃·렌더를 무효화하지 않는다),
           `public object DataContext { get; set; }`.
         - `public event DependencyPropertyChangedEventHandler DataContextChanged` — 그 요소의 유효 DataContext가 바뀔 때마다
           (직접 설정, 조상 변경의 상속, 부모 추가·제거, 바인딩 결과) sender = 그 요소로 발생한다.
         - `public BindingExpression SetBinding(DependencyProperty dp, Binding binding)`, `public BindingExpression SetBinding(DependencyProperty dp, string path)`
           (BindingOperations.SetBinding에 위임).
      3. Core/Data/ (namespace `Xamlity.Data`, 새 영역):
         - `public enum BindingMode { OneWay, Default }`. Default는 OneWay로 동작한다. TwoWay 멤버는 s2에서 WPF 순서대로 맨 앞에 추가한다.
         - `public sealed class PropertyPath`: ctor `(string path)`, `public string Path { get; }`. 허용 문법: null, "", "." (소스 자체),
           그리고 `.`로 구분한 식별자(첫 글자는 문자나 `_`, 나머지는 문자·숫자·`_`, 공백 없음). 그 밖(인덱서 `A[0]`, 첨부 `(Grid.Row)`, `/`, `A..B`,
           앞뒤 `.`, 공백)은 ArgumentException("Property path '<path>' is not supported; use dot-separated property names.").
           이유: 지원하지 않는 문법을 조용히 무시하지 않고(ADR-004), s3 파서가 같은 검사로 임포트 오류를 낸다.
         - `public sealed class Binding`: ctor `()`, `(string path)`, `public PropertyPath Path { get; set; }`, `public BindingMode Mode { get; set; }` (기본 Default).
         - `public sealed class BindingExpression : Expression` (생성자 internal): `ParentBinding`, `Target`(DependencyObject), `TargetProperty`.
         - `public static class BindingOperations`: `SetBinding(DependencyObject target, DependencyProperty dp, Binding binding)` → BindingExpression,
           `GetBindingExpression(DependencyObject target, DependencyProperty dp)` → 없으면 null, `ClearBinding(DependencyObject target, DependencyProperty dp)`.
           null 인자는 ArgumentNullException. target이 FrameworkElement가 아니면 InvalidOperationException("Bindings are only supported on FrameworkElement targets.").
           이유: 소스가 DataContext뿐이다. WPF의 inheritance context(RowDefinition 같은 비요소 대상)는 만들지 마라.
           같은 프로퍼티에 다시 SetBinding하면 이전 식을 떼고 교체한다.
      4. 동작 (WPF와 같게):
         - 소스는 대상 요소의 DataContext다. 단 DataContext 자체에 건 바인딩의 소스는 부모(InheritanceParent가 FrameworkElement일 때)의 DataContext다.
           부모의 DataContext가 바뀌거나 요소가 다른 부모로 옮겨지면 다시 평가한다. 부모가 없으면 소스는 null이다.
           결과는 그 요소의 DataContext가 되어 자손에 상속된다.
         - 경로: 세그먼트마다 현재 객체의 런타임 타입에서 public 인스턴스, getter 있음, 인덱스 매개변수 없는 프로퍼티를 찾는다. (Type, 이름) → PropertyInfo 정적 캐시.
           `new`로 숨겨 같은 이름이 여럿이면 가장 파생된 타입의 선언을 쓴다(GetProperty의 AmbiguousMatchException을 밖으로 내지 마라).
           Reflection.Emit이나 식 트리 컴파일을 쓰지 마라. 이유: ADR-012, IL2CPP.
         - 경로의 각 단계 객체가 INotifyPropertyChanged면 구독한다. PropertyName이 그 단계 세그먼트 이름과 같거나 null·빈 문자열이면 그 단계부터 다시 해석하고
           더 깊은 단계의 구독을 바꾼다. 다른 이름이면 getter를 부르지 않는다.
         - DataContext null, 중간 값 null, 프로퍼티를 찾지 못함, 변환 실패 → 식 값은 UnsetValue(대상은 기본값). 예외를 내지 않는다. 경고 로그는 s2에서 더한다.
         - 기본 변환(소스 값 → 대상 프로퍼티 타입) 순서: null이면 대상이 참조 타입·Nullable이면 null, 아니면 실패 / 대상 타입에 할당 가능하면 그대로 /
           대상이 string이면 IFormattable은 `ToString(null, CultureInfo.InvariantCulture)`, 아니면 `ToString()` / 소스와 대상이 모두 IConvertible이면
           `Convert.ChangeType(value, targetType, CultureInfo.InvariantCulture)` (InvalidCast·Format·Overflow 예외는 실패로 처리) / 그 밖은 실패.
           InvariantCulture인 이유: 게임 UI 문자열이 OS 로캘에 따라 달라지지 않게 한다.
         - DataContext가 바뀌면 처음부터 다시 해석하고 이전 소스의 구독을 모두 해제한다. DataContext가 null이면 구독은 0개다.
           이것이 뷰를 교체할 때 VM이 옛 뷰를 붙잡지 않게 하는 해제 수단이다. 약한 이벤트(WeakReference 기반 구독)를 만들지 마라.
           이유: 할당과 복잡도가 늘고 DataContext 해제로 충분하다.
         - 떼어진 식(SetValue로 대체, ClearValue, ClearBinding, 재 SetBinding)은 모든 구독을 해제하고 더 이상 대상을 바꾸지 않는다.
         - 매 프레임 작업이 없는 이벤트 기반이다. 메인 스레드 전용이며 다른 스레드의 PropertyChanged를 옮기는 장치를 만들지 마라(ARCHITECTURE 스레드 규칙).
      만들지 마라: TwoWay, IValueConverter, 경고 로그(s2), XAML 문법(s3), Source·ElementName·RelativeSource·StringFormat·FallbackValue·UpdateSourceTrigger·OneTime
      (PRD 범위 밖), ICommand(컨트롤 계획).

      테스트 dotnet/Xamlity.Core.Tests/Data/ (테스트용 INotifyPropertyChanged VM은 getter 호출 수와 PropertyChanged 구독자 수를 셀 수 있게 만든다):
      - DataContext: 부모에 설정하면 자식·손자가 상속, DataContextChanged가 영향받는 요소마다 old/new 값과 함께 발생, 자식 추가·제거로 상속이 바뀔 때 발생,
        자식에 로컬 DataContext가 있으면 그 아래로는 발생하지 않음, DataContext 변경은 measure·arrange·render를 무효화하지 않음.
      - `SetBinding(TextBlock.TextProperty, "Name")`: 초기 값, PropertyChanged("Name") 후 갱신과 measure 무효화, 다른 이름은 getter 호출 없음, null·"" 이름은 다시 읽음.
      - 변환: int 42 → Text "42", CurrentCulture를 de-DE로 바꾼 상태에서 double 1.5 → "1.5"(끝나면 복원), int → Width(double), 변환 불가·값 타입에 null → 기본값.
      - 중첩 "Player.Stats.Hp": 중간 객체를 교체하면 새 객체 값이 되고 옛 객체 구독자는 0, 중간 null → 기본값, 다시 채워지면 값. ""·"." → DataContext 자체.
      - 없는 프로퍼티 → 기본값·예외 없음. INotifyPropertyChanged가 아닌 소스는 붙을 때와 DataContext 변경 때만 읽음. `new`로 숨긴 프로퍼티.
      - DataContext 교체·null → 옛 VM 구독자 0.
      - DataContext 바인딩: 부모 DataContext의 Player가 자식 DataContext가 되고 손자 TextBlock의 Text 바인딩이 그 값을 씀, 부모 DataContext 교체,
        요소를 다른 부모로 옮김, 부모 없음 → null.
      - SetValue는 바인딩을 대체(GetBindingExpression null, 이후 VM 변경 무시, 구독 0). ClearValue·ClearBinding → 기본값·구독 0.
        ReadLocalValue는 BindingExpression. 재 SetBinding은 교체.
      - 비 FrameworkElement 대상·null 인자 예외, 공개 SetValue에 식 → ArgumentException, PropertyPath 허용·거부 문법.
      - 바인딩이 있는 트리에서 변화 없는 UpdateLayout + Render 할당 0, PropertyChanged로 값이 바뀌면 render dirty.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Properties/*
      - unity/Packages/com.loonacia.xamlity/Core/Tree/FrameworkElement.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIElement.cs
      - unity/Packages/com.loonacia.xamlity/Core/Data*
      - dotnet/Xamlity.Core.Tests/Data/*
      - dotnet/Xamlity.Core.Tests/Properties/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s2-data-twoway-converters
    title: add two-way bindings, value converters, and binding warnings
    type: feat
    scope: data
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 7), docs/ADR.md (ADR-004, ADR-012), docs/ARCHITECTURE.md (Core 영역 표, 횡단 관심사 > 에러 처리·로깅),
      unity/Packages/com.loonacia.xamlity/Core/Data/*.cs, Core/Properties/Expression.cs, Core/Properties/DependencyObject.cs (s1),
      dotnet/Xamlity.Core.Tests/Data/* (s1 테스트와 VM).

      1. 경고 로그 — Core/Diagnostics/ (namespace `Xamlity.Diagnostics`): `public interface IXamlityLogger { void LogWarning(string message); }`,
         `public static class XamlityLog { public static IXamlityLogger Logger { get; set; } }` (null이면 버린다). Core 안에서는 internal 도우미로 쓴다.
         인터페이스 이름에 ILogger·ILogHandler를 쓰지 마라. 이유: UnityEngine.ILogger·ILogHandler와 using이 충돌한다.
         docs/ARCHITECTURE.md: Core 영역 표에 `Diagnostics` 행(로그 인터페이스와 전역 주입 지점)을 추가하고, 횡단 관심사 > 로깅에 `XamlityLog.Logger`로 주입한다고 적는다.
      2. 경고 (메시지 형식 고정. `<target>`은 `<대상 런타임 타입 Name>.<DP Name>`, `<path>`는 Binding.Path 원문):
         - 경로 오류: `Binding path error: property '<segment>' not found on '<소스 런타임 타입 FullName>'. Path '<path>', target '<target>'.`
         - 변환 실패(정방향·역방향, 기본 변환과 변환기 결과 공통): `Binding conversion error: cannot convert '<value>' (<값 타입 FullName 또는 null>) to '<타입 FullName>'. Path '<path>', target '<target>'.`
           value가 null이면 `'null'`로 쓴다.
         - 읽기 전용 소스: `Binding source error: property '<name>' on '<타입 FullName>' is read-only. Path '<path>', target '<target>'.`
         DataContext null, 중간 값 null, 변환기가 돌려준 UnsetValue는 경고하지 않는다(WPF 기본 수준과 같음). 같은 실패가 다시 일어나면 다시 경고한다(중복 억제 없음).
         s1의 "경로 오류·변환 실패 → 기본값" 동작은 그대로 두고 경고만 더한다. s1 테스트 기대값은 바꾸지 마라.
      3. `BindingMode { TwoWay, OneWay, Default }` (WPF 순서). Default는 여전히 OneWay로 동작한다. BindsTwoWayByDefault 메타데이터는 만들지 마라.
         이유: 기본 TwoWay인 WPF 프로퍼티(TextBox.Text 등)가 아직 없다.
         TwoWay (WPF와 같게):
         - 대상에 SetValue하면 바인딩은 유지되고, 대상 유효 값이 새 값이 되며(변경 알림), 역변환한 값을 경로 마지막 프로퍼티에 쓴다
           (UpdateSourceTrigger는 항상 PropertyChanged). 기본 역변환은 s1 기본 변환과 같은 규칙으로 대상 값 → 소스 프로퍼티 타입이다.
         - 소스에 쓰는 동안 그 소스가 보낸 PropertyChanged로 대상을 즉시 다시 쓰지 않는다. 쓰기가 끝난 뒤 소스를 한 번 다시 읽어 대상에 반영한다
           (.NET 4.0 이후 WPF와 같음: setter가 값을 보정하면 대상도 보정된 값이 된다).
         - 경로가 해석되지 않은 상태(DataContext null, 중간 null, 경로 오류)면 소스를 쓰지 않고 대상 값만 바뀐다. 소스 프로퍼티에 public setter가 없으면
           읽기 전용 경고 후 쓰지 않는다. 역변환이 실패하면 변환 경고 후 쓰지 않는다.
         - 경로가 소스 자체(null·""·".")인 TwoWay는 SetBinding에서 InvalidOperationException("Two-way binding requires a property path.").
         - ClearValue·ClearBinding은 TwoWay도 바인딩을 뗀다. OneWay·Default는 s1처럼 SetValue로 대체된다.
      4. `public interface IValueConverter` (namespace Xamlity.Data, WPF와 같은 시그니처. System.Windows.Data가 없으므로 직접 정의):
         `object Convert(object value, Type targetType, object parameter, CultureInfo culture)`, `object ConvertBack(object value, Type targetType, object parameter, CultureInfo culture)`.
         Binding에 `public IValueConverter Converter { get; set; }`, `public object ConverterParameter { get; set; }`.
         - 정방향: 경로가 해석되면 소스 값(null 포함)을 `Convert(value, TargetProperty.PropertyType, ConverterParameter, CultureInfo.InvariantCulture)`에 넘긴다.
           결과에는 기본 변환을 적용하지 않는다(WPF와 같음). 결과가 UnsetValue면 기본값(경고 없음). 대상 타입에 맞지 않으면(값 타입에 null 포함)
           변환 경고 후 기본값. 경로가 해석되지 않으면 Convert를 부르지 않는다.
         - 역방향(TwoWay): `ConvertBack(대상 값, 소스 프로퍼티 타입, ConverterParameter, CultureInfo.InvariantCulture)`. UnsetValue면 소스를 쓰지 않는다.
           소스 타입에 맞지 않으면 변환 경고 후 쓰지 않는다.
         - 변환기 예외는 잡지 않는다(WPF와 같음).
      5. 봉인: SetBinding에 한 번 쓰인 Binding의 프로퍼티를 바꾸면 InvalidOperationException("Binding cannot be changed after it has been used.") (WPF와 같음).
         같은 Binding을 여러 대상에 쓰는 것은 허용한다(대상마다 식).
      만들지 마라: OneTime·OneWayToSource, UpdateSourceTrigger, ValidationRule·ValidatesOnExceptions, Binding.DoNothing, StringFormat·FallbackValue·TargetNullValue,
      경고 중복 억제, Unity 로그 연결(s7). 이유: PRD 범위 밖이거나 이후 스텝이다.

      테스트 dotnet/Xamlity.Core.Tests/Data/ (기록용 IXamlityLogger를 SetUp에서 넣고 TearDown에서 null로 되돌린다):
      - TwoWay: 대상 SetValue → 소스 갱신·바인딩 유지·이후 소스 변경 반영, int 소스 ← double 대상 역변환, 값을 0~100으로 고정하는 setter에 150을 쓰면 대상도 100,
        재진입 없음(대상 변경 알림 횟수), 경로 미해석이면 소스 미기록·대상만 변경, 읽기 전용 소스 경고, 소스 자체 경로 예외, 중첩 경로의 마지막 프로퍼티에 기록.
      - 변환기: Convert 인자(targetType, parameter, InvariantCulture), 결과에 기본 변환 없음(string 대상에 int 결과 → 경고·기본값), UnsetValue → 기본값·경고 없음,
        경로 미해석이면 호출 없음, ConvertBack 인자와 UnsetValue면 소스 미기록, 변환기 예외 전파.
      - 경고 메시지 정확한 문자열: 경로 오류, 정방향·역방향 변환 실패, 읽기 전용. DataContext null·중간 null은 경고 없음. Logger가 null이어도 예외 없음.
      - 봉인 예외와 같은 Binding을 두 대상에 쓰기.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Data*
      - unity/Packages/com.loonacia.xamlity/Core/Diagnostics*
      - unity/Packages/com.loonacia.xamlity/Core/Properties/*
      - dotnet/Xamlity.Core.Tests/Data/*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s3-markup-binding-extension
    title: parse Binding markup extensions and Binding object elements
    type: feat
    scope: markup
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 1, 2), docs/ADR.md (ADR-003, ADR-004), docs/ARCHITECTURE.md (`Markup` 영역, IR 직렬화 형식),
      unity/Packages/com.loonacia.xamlity/Core/Markup/*.cs (특히 XamlParser.cs의 ReadObject·ReadAttributes·ReadPropertyElement, XamlBuilder.cs의 ApplyProperty,
      XamlValueConverter.cs, XamlTypeResolver.cs), Core/Data/*.cs (s1·s2: Binding, PropertyPath, BindingOperations),
      dotnet/Xamlity.Core.Tests/Markup/XamlParserTests.cs, XamlBuilderTests.cs.

      1. 이름 해석: XamlTypeResolver.Resolve가 기본 xmlns에서 `Xamlity.Data` 네임스페이스도 찾는다(`<Binding>` 객체 요소).
      2. 속성 값의 마크업 확장 (MS-XAML 문법):
         - 값이 `{}`로 시작하면 이스케이프다. 나머지가 리터럴 텍스트다. IR에는 원문을 그대로 두고 XamlValueConverter.TryConvert가 접두사를 벗긴다
           (파서 검증과 빌더가 같은 결과를 낸다).
         - `{`로 시작하는 다른 값은 `{TypeName 위치인자?, Name=Value, ...}`로 파싱한다. 값은 앞뒤 공백을 잘라낸다. `'` 또는 `"`로 감싸면 인용 값이며
           구분자(`,` `=` `}`)를 포함할 수 있다. `\`는 다음 문자를 그대로 넣는다.
         - 이 계획에서 지원하는 확장은 기본 xmlns의 `Binding` 하나다. 다른 이름(`StaticResource`, `TemplateBinding`, `x:Type`, `x:Static`, 모르는 이름)은
           `Markup extension '<쓴 이름 그대로>' is not supported.` 값 안의 중첩 확장(`Converter={StaticResource c}`)은 `Nested markup extensions are not supported.`
           이유: StaticResource 등은 다음 계획이다.
         - 문법 오류(닫는 `}` 없음, 닫히지 않은 인용, 빈 타입 이름, 이름 없는 `=`, 이름 있는 인자 뒤의 위치 인자, `}` 뒤의 텍스트)는
           `Invalid markup extension syntax: <짧은 설명>.`
         - Binding은 위치 인자 0개 또는 1개(Path)를 받는다. 더 많으면 `Markup extension 'Binding' accepts at most one positional argument (Path).`
           위치 인자 Path와 `Path=`를 함께 쓰면 기존 `Property 'Path' is set more than once.`
         - 이름 있는 인자는 Binding 타입의 프로퍼티로 해석하고 일반 속성과 같은 규칙으로 검증한다(모르는 이름은 기존 `Unknown or read-only property 'ElementName' on type 'Binding'.`,
           잘못된 Mode는 기존 `Property 'Mode': 'X' is not a valid BindingMode value.`). Converter는 텍스트로 만들 수 없으므로 기존 변환 오류가 된다(XAML 변환기는 s4의 객체 요소로 쓴다).
         - IR: 확장 값을 가진 속성은 `XamlPropertyNode`(TextValue null)와 그 Objects의 Binding `XamlObjectNode` 하나로 저장한다. 위치 인자는 `Path` 프로퍼티 노드가 된다.
           확장에서 나온 모든 노드의 Line/Column은 그 속성의 위치다. IR 형식(v2)은 바꾸지 않는다.
           docs/ARCHITECTURE.md의 IR 문단에 이 표현과 `{}` 이스케이프 규칙을 적는다.
      3. `<Binding>` 객체 요소: 단일 값 프로퍼티 요소의 유일한 객체로 허용한다(`<TextBlock.Text><Binding Path="Name"/></TextBlock.Text>`).
         Binding 자신의 속성과 프로퍼티 요소(`<Binding.Converter>`)는 일반 객체와 같은 규칙이다.
      4. Binding 대상 규칙(속성 확장과 객체 요소 공통): 대상은 FrameworkElement 요소의 DP(첨부 DP 포함)여야 한다. CLR 프로퍼티, FrameworkElement가 아닌 객체
         (SolidColorBrush, RowDefinition, Binding 등)의 프로퍼티, content property의 암시적 자식, 컬렉션 항목에 Binding이 오면
         `A 'Binding' can only be set on a dependency property of a FrameworkElement.` 이유: s1이 FrameworkElement 대상만 지원한다.
         ImageSource 프로퍼티의 `{Binding}`은 허용하며 에셋 참조로 기록하지 않는다. x:Name 값은 마크업 확장을 받지 않는다(기존 오류 유지).
      5. XamlValueConverter: 대상 타입 `PropertyPath`는 s1 생성자 검사로 오류를 낸다(`Property 'Path': <ArgumentException 메시지>`).
         대상 타입 `object`는 텍스트 그대로 string이다(WPF와 같음: `ConverterParameter=abc`, `DataContext="abc"`).
      6. XamlBuilder: 객체 값이 Binding이면 SetValue 대신 `BindingOperations.SetBinding(대상, dp, binding)`. 일반 프로퍼티와 첨부 프로퍼티 모두. 실패는 기존처럼 XamlBuildException(줄·열).
      만들지 마라: clr-namespace(s4), x:DataType(s5), StaticResource와 다른 확장, 확장 생성자 인자 일반화(ConstructorArgument 등).
      이유: 이후 스텝이거나 다음 계획이며, 확장이 Binding 하나라 일반화가 필요 없다.
      기존 테스트 변경(요구사항 변경): XamlParserTests의 `Canvas.Left="{Binding X}"`와 `Name="{Binding Name}"` 케이스는 이제 정상이므로 오류 목록에서 빼고
      새 테스트에서 정상 동작을 검증한다. `x:Name="{Binding Name}"` 케이스는 그대로 둔다. 다른 기존 기대값은 바꾸지 마라.

      테스트 dotnet/Xamlity.Core.Tests/Markup/BindingMarkupTests.cs:
      - IR: `{Binding}`, `{Binding Name}`, `{Binding Path=Player.Hp, Mode=TwoWay}`, `{Binding Path='A', ConverterParameter='x, y'}`, `\`가 있는 값, 객체 요소 형식의 노드와 위치.
      - 끝에서 끝까지(Parse → Serialize → Deserialize → Build → DataContext 설정): TextBlock.Text OneWay와 VM 변경 반영, TwoWay로 대상 SetValue가 VM에 기록,
        `Canvas.Left="{Binding X}"`의 배치 좌표, `DataContext="{Binding Player}"`와 자식 바인딩, `Text="{}{0} HP"` → "{0} HP", `DataContext="abc"`, 객체 요소 형식.
      - 오류 각각의 메시지와 정확한 줄·열: 지원하지 않는 확장 3종, 중첩, 문법 오류 몇 가지, 위치 인자 2개, Path 중복, 모르는 이름 있는 인자, 잘못된 Mode,
        지원하지 않는 경로 `A[0]`, CLR 프로퍼티·비 FrameworkElement·content 자식·컬렉션 항목의 Binding.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup/*
      - unity/Packages/com.loonacia.xamlity/Core/Data/*
      - dotnet/Xamlity.Core.Tests/Markup/*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s4-markup-clr-namespaces
    title: resolve clr-namespace xmlns mappings to user types
    type: feat
    scope: markup
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 2), docs/ADR.md (ADR-003, ADR-004, ADR-012), docs/ARCHITECTURE.md (`Markup` 영역, 데이터 흐름 > 에디터: 임포트),
      unity/Packages/com.loonacia.xamlity/Core/Markup/*.cs (s3 결과, 특히 XamlTypeResolver.cs, XamlParser.cs, XamlParseResult.cs, XamlBuilder.cs의 GetType),
      Core/Data/IValueConverter.cs (s2), dotnet/Xamlity.Core.Tests/Markup/XamlParserTests.cs, BindingMarkupTests.cs (s3).

      WPF처럼 `xmlns:local="clr-namespace:Game.UI;assembly=Assembly-CSharp"`로 사용자 타입을 객체 요소로 쓸 수 있게 한다. 주 용도는 바인딩 변환기다:
      `<Binding Path="Hp"><Binding.Converter><local:HpConverter/></Binding.Converter></Binding>`.
      1. 매핑 문법: `clr-namespace:<CLR 네임스페이스>;assembly=<어셈블리 단순 이름>`. `assembly=`가 없으면 `clr-namespace mapping '<uri>' must specify 'assembly='.`
         이유: Unity의 XAML은 어느 어셈블리에도 컴파일되지 않아 WPF의 "현재 어셈블리"가 없고, 임포터가 어셈블리별 재임포트 의존성을 걸어야 한다(ADR-003, s6).
         네임스페이스가 비었거나 형식이 틀리면 `Invalid clr-namespace mapping '<uri>'.` 기본 xmlns와 clr-namespace가 아닌 다른 URI는 기존 `XML namespace '<uri>' is not supported.`
      2. 타입 해석: `Type.GetType("<네임스페이스>.<이름>, <어셈블리>")` 결과를 (URI, 이름) 캐시한다. 없으면(어셈블리를 못 찾은 경우 포함)
         `Unknown type '<이름>' in namespace '<네임스페이스>' of assembly '<어셈블리>'.` 객체 요소로 만들 타입은 기본 xmlns와 같은 조건(public, 클래스, 비추상,
         제네릭 아님, public 매개변수 없는 생성자)이며 아니면 `Type '<FullName>' cannot be created from XAML; it must be a public non-abstract class with a public parameterless constructor.`
         그 밖의 규칙(루트는 UIElement, x:Name은 FrameworkElement, 대상 프로퍼티에 할당 가능, 속성·프로퍼티 요소·content property 처리)은 기본 xmlns 타입과 같다.
         IR TypeName은 이미 `"<FullName>, <어셈블리>"`이므로 IR 형식과 빌더 해석은 그대로다.
      3. 프로퍼티 요소 `<p:Owner.Property>`: Owner를 그 요소의 XML 네임스페이스로 해석하고, 요소 타입이거나 그 기반 타입이어야 한다
         (`<local:MyBorder><Border.Background>`도 허용, WPF와 같음). 기존 "이름만 비교" 방식을 이 규칙으로 바꾼다. 기존 오류 메시지는 유지한다.
      4. clr-namespace의 속성(`local:Foo.Bar="1"`, 사용자 첨부 프로퍼티)은 지원하지 않는다는 기존 `XML namespace ... is not supported.` 오류로 둔다. 이유: 이 계획에 필요 없다.
      5. `XamlParseResult.ReferencedAssemblies` (`IReadOnlyList<string>`): 문서에 선언된 모든 clr-namespace 매핑의 어셈블리 이름(중복 없이 처음 나온 순서).
         사용 여부와 관계없이 넣고, 파싱 오류가 있어도 채운다. 이유: s6 임포터가 이 목록으로 의존성을 걸어, 아직 없는 타입·어셈블리가 컴파일되면 다시 임포트되게 한다.
      6. docs/ARCHITECTURE.md 횡단 관심사에 "XAML 이름 해석" 항목을 추가한다: 기본 xmlns가 찾는 Core 네임스페이스(Controls, Layout, Rendering, Data), clr-namespace는 assembly= 필수.
      만들지 마라: assembly= 생략 시 전체 어셈블리 검색, 사용자 첨부 프로퍼티, XmlnsDefinition 속성, 제네릭 타입(x:TypeArguments). 이유: PRD 범위 밖이다.
      기존 테스트 변경(요구사항 변경): XamlParserTests.RejectsUnsupportedElementNamespace의 `clr-namespace:Xamlity.Controls;assembly=Xamlity.Core` 케이스는
      이제 정상이므로 그 케이스를 빼고 새 테스트에서 Border로 해석되는지 검증한다. 다른 기존 기대값은 바꾸지 마라.

      테스트 dotnet/Xamlity.Core.Tests/Markup/ClrNamespaceMarkupTests.cs (테스트 어셈블리 `Xamlity.Core.Tests`에 public 변환기·FrameworkElement 파생 타입을 둔다):
      - 끝에서 끝까지: `<Binding.Converter><t:UpperCaseConverter/></Binding.Converter>`로 Build → DataContext 설정 → 변환된 Text, 변환기 속성(`Suffix="!"` 같은 CLR 프로퍼티) 적용,
        ConverterParameter 전달, TwoWay ConvertBack, 사용자 FrameworkElement 파생 타입을 자식·루트로 쓰기, `<t:MyBorder><Border.Background>` 프로퍼티 요소.
      - 오류 메시지와 줄·열: assembly= 없음, 형식 오류, 없는 타입, 없는 어셈블리, 추상·생성자 없음·제네릭 타입, IValueConverter가 아닌 타입을 Converter에, clr 속성.
      - ReferencedAssemblies: 여러 매핑의 순서와 중복 제거, 쓰지 않은 매핑 포함, 오류가 있는 문서에서도 채워짐.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup/*
      - dotnet/Xamlity.Core.Tests/Markup/*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s5-markup-datatype-validation
    title: validate binding paths against x:DataType at parse time
    type: feat
    scope: markup
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 1, 2), docs/ADR.md (ADR-012), docs/ARCHITECTURE.md (횡단 관심사 > 에러 처리, s4의 XAML 이름 해석),
      unity/Packages/com.loonacia.xamlity/Core/Markup/*.cs (s3·s4 결과), Core/Data/PropertyPath.cs, Core/Data/BindingExpression.cs (s1의 런타임 경로 해석 규칙),
      dotnet/Xamlity.Core.Tests/Markup/BindingMarkupTests.cs, ClrNamespaceMarkupTests.cs.

      ADR-012의 x:DataType 검증을 파서(Core)에 넣는다. 런타임 바인딩 동작과 IR은 바꾸지 않는다(x:DataType은 IR에 저장하지 않는다).
      1. `x:DataType="prefix:TypeName"` 속성을 모든 요소에서 받는다. 접두사 없는 이름은 기본 xmlns로 해석한다. 접두사는 그 요소 위치의 xmlns 선언으로 찾는다.
         타입은 public이면 된다(인터페이스·추상 클래스·구조체 허용, 생성자 조건 없음). 못 찾으면 s4와 같은 알 수 없는 타입 오류.
         값이 `{`로 시작하면 `x:DataType does not support markup extensions; use 'prefix:TypeName'.` 이유: {x:Type}은 다음 계획이다.
      2. 범위: x:DataType은 그 요소와 자손의 바인딩에 적용되고 자손의 x:DataType이 덮어쓴다. 단 DataContext 프로퍼티에 건 바인딩은 같은 요소의 x:DataType이 아니라
         부모 쪽 범위의 타입으로 검증한다. 이유: 런타임에서 DataContext 바인딩의 소스는 부모의 DataContext다(s1).
         범위에 x:DataType이 없으면 검증하지 않는다(런타임 경고만. x:DataType을 필수로 만들지 마라, ADR-012).
      3. 검증 (속성 확장과 `<Binding>` 객체 요소 공통, 오류 위치는 그 Binding의 위치): Path 세그먼트마다 현재 타입에서 public 인스턴스, getter 있음, 인덱스 매개변수 없는
         프로퍼티를 찾는다(기반 타입 포함, 인터페이스 타입이면 상속한 인터페이스까지, 같은 이름이면 가장 파생된 선언). 다음 세그먼트의 타입은 그 프로퍼티의 선언 타입이다.
         - 없으면 `Binding path '<path>': property '<segment>' was not found on type '<FullName>' (x:DataType).`
         - Mode가 TwoWay이고 마지막 프로퍼티에 public setter가 없으면 `Binding path '<path>': property '<segment>' on type '<FullName>' has no public setter; TwoWay bindings require one.`
         - 빈 경로·"."은 통과. Converter가 있어도 경로는 검증한다. 소스·대상 타입 호환성은 검사하지 않는다(변환기·기본 변환이 런타임에 처리).
         선언 타입으로 검증하므로 런타임 타입에만 있는 프로퍼티는 오류가 된다. 이것은 의도된 동작이다(컴파일된 바인딩과 같다).
      4. docs/ARCHITECTURE.md의 "XAML 이름 해석"(s4) 근처에 x:DataType 범위·DataContext 바인딩 규칙을 한두 줄로 적는다.
      만들지 마라: `{x:Type}` 형식, 바인딩 소스·대상 타입 검사, x:DataType 기반 컴파일된 바인딩(리플렉션 대체). 이유: ADR-012가 리플렉션 바인딩을 정했고 나머지는 범위 밖이다.
      기존 테스트 변경(요구사항 변경): XamlParserTests의 `x:DataType="View"` 케이스는 이제 "지원하지 않는 지시어"가 아니라 알 수 없는 타입 오류를 기대하도록 바꾼다.
      다른 기존 기대값은 바꾸지 마라.

      테스트 dotnet/Xamlity.Core.Tests/Markup/DataTypeMarkupTests.cs (테스트 어셈블리에 VM 타입을 둔다):
      - 정상: 단일·중첩 경로, 기반 클래스 프로퍼티, 인터페이스 x:DataType의 상속 인터페이스 프로퍼티, 빈 경로, 객체 요소 형식, 변환기가 있는 바인딩, x:DataType 없는 문서는 오타도 통과.
      - 오류 메시지와 정확한 줄·열: 첫 세그먼트 오타, 중간 세그먼트 오타, TwoWay 읽기 전용, 인덱서만 있는 이름, 알 수 없는 x:DataType 타입, 마크업 확장 값.
      - 범위: 자손의 x:DataType 덮어쓰기, 형제 범위 분리, `DataContext="{Binding Player}"`와 같은 요소의 `x:DataType="t:PlayerModel"` 조합에서 DataContext 바인딩은
        부모 타입으로, 나머지 바인딩과 자식은 PlayerModel로 검증됨.
      - x:DataType 문서가 오류 없이 Build되고 런타임 바인딩이 동작함(검증이 런타임 동작을 바꾸지 않음).
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup/*
      - dotnet/Xamlity.Core.Tests/Markup/*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s6-editor-assembly-dependencies
    title: reimport XAML when referenced script assemblies change
    type: feat
    scope: editor
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 1), docs/ADR.md (ADR-003의 의존성 규칙, ADR-011의 OnImportAsset 금지 사항, ADR-013),
      docs/ARCHITECTURE.md (데이터 흐름 > 에디터: 임포트, IR 문단의 임포터 버전), unity/Packages/com.loonacia.xamlity/Editor/XamlImporter.cs,
      Core/Markup/XamlParseResult.cs (s4의 ReferencedAssemblies), Runtime/XamlAsset.cs, Tests/Editor/XamlImporterTests.cs (임시 폴더 방식, 재임포트 테스트),
      Tests/Editor/Xamlity.Editor.Tests.asmdef.

      ADR-003: XAML이 사용자 타입을 참조하면 그 어셈블리에 커스텀 의존성을 걸어, 스크립트가 다시 컴파일되면 관련 XAML만 다시 임포트되게 한다.
      1. Editor/XamlAssemblyDependencies.cs (internal static):
         - `internal static string GetDependencyName(string assemblyName)` → `"Xamlity/Assembly/" + assemblyName`.
         - `[InitializeOnLoadMethod]`(도메인 리로드 뒤)에 `CompilationPipeline.GetAssemblies(AssembliesType.Editor)`의 각 어셈블리 outputPath 파일 내용으로
           `Hash128`을 계산해 `AssetDatabase.RegisterCustomDependency(이름, 해시)`로 등록한다. 파일이 없으면 건너뛴다. 등록 함수는 테스트가 부를 수 있게
           `internal static void RegisterAll()`로 둔다.
         - 바뀐 해시가 의존 XAML의 재임포트로 이어지도록 등록 뒤 `AssetDatabase.Refresh()`가 일어나게 한다(필요하면 `EditorApplication.delayCall`). OnImportAsset 안에서
           Refresh·ImportAsset을 부르지 마라(ADR-011).
         - 리로드 전에 등록하지 마라. 이유: 재임포트 때 파서가 새 타입을 리플렉션으로 찾아야 하므로 새 어셈블리가 로드된 뒤여야 한다.
         - 도메인 리로드마다 실행되므로 이 프로젝트에서 걸린 시간을 재서 summary에 적는다.
      2. XamlImporter: `result.ReferencedAssemblies`마다 `ctx.DependsOnCustomDependency(GetDependencyName(name))`를 부른다. 파싱 오류가 있어도 부른다.
         이유: 없는 타입 때문에 실패한 XAML이 사용자가 그 타입을 만든 뒤 자동으로 다시 임포트되어야 한다.
         `[ScriptedImporter(3, "xaml")]`를 4로 올린다. 이유: 이전 버전에서 바인딩·clr-namespace·x:DataType 때문에 오류로 임포트된 XAML을 새 규칙으로 다시 임포트한다.
      3. docs/ARCHITECTURE.md: 데이터 흐름의 커스텀 의존성 줄에 이름 형식과 등록 시점(도메인 리로드 뒤, 출력 DLL 내용 해시)을 적고, IR 문단의 임포터 버전을 4로 고친다.
      만들지 마라: 미리 컴파일된 DLL(플러그인) 추적, Assembly-CSharp 외 경로 추측, 공개 API만 해시하기. 이유: 이 계획 범위 밖이다.

      테스트 Tests/Editor/XamlBindingImportTests.cs (테스트용 VM·변환기는 Tests/Editor/의 새 파일, namespace Xamlity.Editor.Tests, 어셈블리 Xamlity.Editor.Tests):
      - `Assets/XamlityTestTemp/`에 `xmlns:t="clr-namespace:Xamlity.Editor.Tests;assembly=Xamlity.Editor.Tests"`, `x:DataType="t:..."`, `{Binding}`, `<t:...Converter/>`를 쓴 XAML을
        임포트하면 HasIr이고 Build 후 DataContext를 넣으면 변환된 값이 나온다.
      - x:DataType이 있는 XAML의 경로 오타는 `파일(줄,열): Binding path ...` 임포트 오류이고 HasIr false (PRD 핵심 기능 1). 알 수 없는 사용자 타입도 줄·열 오류.
      - 재임포트: 정상 XAML을 임포트한 뒤 `AssetDatabase.RegisterCustomDependency(GetDependencyName("Xamlity.Editor.Tests"), 다른 해시)`와 `AssetDatabase.Refresh()`를 하면
        그 XAML이 다시 임포트된다(예: 이전에 로드한 XamlAsset이 파괴되고 새 객체가 로드됨). 그다음 `RegisterAll()`과 Refresh로 다시 재임포트됨을 확인해 이름이 일치함을 검증한다.
        같은 시나리오를 오류가 있는 XAML(없는 타입)에도 적용해 오류 XAML도 의존성이 걸렸음을 확인한다. 참조하지 않는 어셈블리 이름의 해시를 바꾸면 재임포트되지 않는다.
      - TearDown에서 임시 폴더를 지우고 `RegisterAll()`로 실제 해시를 되돌린다.
      자동 재임포트가 되지 않으면 테스트를 약화하지 말고 blockers에 적는다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Editor/XamlImporter.cs
      - unity/Packages/com.loonacia.xamlity/Editor/XamlAssemblyDependencies.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/XamlBindingImportTests.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/BindingTestTypes.cs*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s7-unity-datacontext-host
    title: set DataContext on XamlityRoot and log binding warnings to the console
    type: feat
    scope: unity
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 7, 12), docs/ARCHITECTURE.md (레이어 규칙, 횡단 관심사 > 로깅·설정), unity/Packages/com.loonacia.xamlity/Runtime/XamlityRoot.cs,
      Runtime/XamlAsset.cs, Runtime/AssemblyInfo.cs, Core/Diagnostics/*.cs (s2), Core/Tree/FrameworkElement.cs (s1의 DataContext),
      Tests/Editor/RenderingTests.cs (루트 생성·Refresh·MeshRebuildCount 도우미), Tests/Editor/XamlImporterTests.cs (메모리 XamlAsset을 만드는 MissingRuntimeReferences 테스트).

      1. XamlityRoot: `public object DataContext { get; set; }` (PRD 12: DataContext는 코드에서 넣는다).
         - 값을 보관하고, 트리가 있으면 루트 요소(FrameworkElement일 때)의 DataContext에 바로 넣는다. Build가 새 트리를 만들면 그 루트에 넣는다.
         - Build가 기존 트리를 교체하거나 OnDestroy될 때 옛 루트의 DataContext를 null로 만든다. 이유: s1에서 DataContext가 null이 되면 바인딩 구독이 모두 해제되므로,
           파괴된 뷰가 VM의 PropertyChanged를 계속 받지 않게 한다.
      2. Runtime/UnityXamlityLogger.cs: `internal sealed class UnityXamlityLogger : IXamlityLogger` — `Debug.LogWarning(message)`.
         `internal static void Install()`가 `XamlityLog.Logger`에 넣는다. 플레이어·플레이 모드는 `[RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.SubsystemRegistration)]`로,
         에디터(Edit 모드 포함)는 Editor 어셈블리의 `[InitializeOnLoadMethod]`(새 파일 Editor/XamlityEditorStartup.cs)로 Install을 부른다(Runtime의 InternalsVisibleTo 사용).
         Runtime에 `#if UNITY_EDITOR`로 UnityEditor를 참조하지 마라. 이유: 에디터 전용 기능은 Xamlity.Editor에 둔다(ARCHITECTURE 레이어 규칙).
      3. docs/ARCHITECTURE.md 횡단 관심사 > 로깅에 Unity 연결 방식(위 두 진입점)을 한 줄로 적는다.
      만들지 마라: 핫리로드(재임포트 감지와 뷰 재생성), Inspector에서 DataContext 지정, Project Settings UI. 이유: PRD 13과 다음 계획 범위다.

      테스트 Tests/Editor/BindingRuntimeTests.cs (XAML 텍스트를 Core 파서로 파싱·직렬화해 메모리 XamlAsset을 만들고 XamlityRoot 도우미로 Refresh한다. 테스트 VM은 s6의 테스트 타입을 재사용해도 된다):
      - Build 전에 DataContext를 넣어도, Build 뒤에 넣어도 `{Binding Name}` TextBlock이 VM 값을 쓰고 메시가 만들어짐.
      - VM의 PropertyChanged 뒤 Refresh하면 MeshRebuildCount가 늘고 글리프 수(또는 배치 정점 수)가 바뀜. 변화 없는 두 번째 Refresh는 다시 만들지 않고 할당 0.
      - 경로 오류가 있는 바인딩은 `LogAssert.Expect(LogType.Warning, "Binding path error: ...")`로 Unity 콘솔 경고를 확인(Edit 모드에서 Install이 되어 있음).
      - DestroyImmediate(XamlityRoot 게임 오브젝트) 뒤 VM의 PropertyChanged 구독자 0. 같은 루트에서 Build를 다시 부르면 옛 트리의 구독자 0이고 새 트리가 같은 DataContext를 씀.
      - 생성한 게임 오브젝트·에셋은 TearDown에서 정리한다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlityRoot.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/UnityXamlityLogger.cs*
      - unity/Packages/com.loonacia.xamlity/Editor/XamlityEditorStartup.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/BindingRuntimeTests.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/BindingTestTypes.cs
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s8-sample-binding
    title: add player status sample scene driven by a view model
    type: feat
    scope: sample
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 7, 12), unity/Assets/Samples/Hud/Hud.xaml (샘플 XAML 스타일), unity/Assets/Scenes/HudSample.unity,
      unity/Packages/com.loonacia.xamlity/Tests/Editor/SampleSetupTests.cs, Runtime/XamlityRoot.cs (s7의 DataContext), Core/Data/*.cs (Binding, IValueConverter),
      dotnet/Xamlity.Core.Tests/Markup/DataTypeMarkupTests.cs·ClrNamespaceMarkupTests.cs (XAML 문법 예).

      이 계획의 기능을 한 화면에서 보여 주는 바인딩 샘플을 만든다. 기존 Hello·Hud 샘플과 씬은 바꾸지 마라. 이유: SampleSetupTests가 그 구성을 검증한다.
      샘플 스크립트는 unity/Assets 아래라 Assembly-CSharp에 들어간다. namespace는 `Xamlity.Samples.Binding`.
      1. unity/Assets/Samples/Binding/PlayerStatusViewModel.cs: INotifyPropertyChanged를 구현한 `PlayerStatusViewModel`(`PlayerModel Player`, `int Gold`)과
         `PlayerModel`(`string Name`, `int Hp`, `int MaxHp`, 읽기 전용 `double HpRatio` — Hp·MaxHp가 바뀌면 HpRatio 변경도 알린다).
      2. unity/Assets/Samples/Binding/RatioToWidthConverter.cs: `IValueConverter` — double 비율 × ConverterParameter(문자열, InvariantCulture로 파싱한 픽셀 폭). ConvertBack은 NotSupportedException.
      3. unity/Assets/Samples/Binding/PlayerStatus.xaml: `xmlns:local="clr-namespace:Xamlity.Samples.Binding;assembly=Assembly-CSharp"`. 반드시 포함:
         루트 `x:DataType="local:PlayerStatusViewModel"`, `DataContext="{Binding Player}"`와 `x:DataType="local:PlayerModel"`이 있는 패널, 이름·HP·최대 HP·골드 TextBlock 바인딩(한글 라벨 포함),
         `<Border.Width><Binding Path="HpRatio" ConverterParameter="..."><Binding.Converter><local:RatioToWidthConverter/></Binding.Converter></Binding></Border.Width>`로 만든 HP 막대,
         `{}` 이스케이프를 쓴 리터럴 텍스트 하나. 기준 해상도 1920x1080에서 보기 좋게 배치한다.
      4. unity/Assets/Samples/Binding/PlayerStatusDemo.cs: MonoBehaviour. `[SerializeField] private XamlityRoot root;` Start에서 VM을 만들어 `root.DataContext`에 넣고,
         Update에서 일정 간격으로 HP를 줄였다가 0이 되면 다시 채우고 골드를 늘린다.
      5. unity/Assets/Scenes/BindingSample.unity: HudSample과 같은 URP 카메라 설정의 Main Camera, XamlityRoot(xaml = PlayerStatus.xaml, 기준 해상도 1920x1080),
         root가 연결된 PlayerStatusDemo. 씬은 일회성 batchmode 스크립트로 만들어도 되며 그 스크립트는 커밋하지 말고 지운다.
      6. 테스트 SampleSetupTests.cs에 추가 (Xamlity.Editor.Tests는 Assembly-CSharp를 참조할 수 없으므로 샘플 타입은 `Type.GetType("..., Assembly-CSharp")` 리플렉션으로 다룬다):
         PlayerStatus.xaml이 HasIr(= x:DataType 검증과 clr-namespace 해석 통과), Build한 트리에 리플렉션으로 만든 VM을 DataContext로 넣으면 이름·HP 텍스트가 VM 값이고
         HP를 바꾸면 텍스트와 막대 폭이 바뀜, BindingSample 씬에 PlayerStatus.xaml을 참조하는 XamlityRoot와 root가 연결된 PlayerStatusDemo가 있음(Additive로 열고 테스트 끝에 닫는다).
      화면이 실제로 의도대로 보이는지는 사람이 Play 모드에서 확인한다. summary에 확인 방법(씬 이름, 기대 화면, 시간에 따라 HP 막대·숫자·골드가 바뀌는지)을 적는다.
    expected_files:
      - unity/Assets/Samples/Binding*
      - unity/Assets/Scenes/BindingSample.unity*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/SampleSetupTests.cs
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'
