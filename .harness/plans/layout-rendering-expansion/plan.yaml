id: layout-rendering-expansion
goal: >
  정적인 게임 HUD·메뉴 화면을 XAML로 배치할 수 있도록 레이아웃과 렌더링을 넓힌다. XAML 문법에 프로퍼티 요소(`<Border.Background>`)와
  첨부 프로퍼티(`Canvas.Left`, `Grid.Row`)를 추가하고, Canvas, Grid(Pixel·Auto·star 정의, span, 정의의 Min/Max), TextBlock의
  TextWrapping·TextAlignment(여러 줄), UIElement의 Opacity·ClipToBounds와 WPF식 레이아웃 클립, XamlityRoot의 기준 해상도 배율,
  Border의 CornerRadius, Image(Texture2D/Sprite, Stretch, Sprite border 기반 9-slice, XAML 에셋 경로 참조)를 만든다.
  새 HUD 샘플 씬에서 이 기능들로 만든 화면이 보이면 완료다.
  스타일·템플릿·리소스, 바인딩, 입력, 컨트롤(Button 등), 코드비하인드, 핫리로드, FontFamily, sortingOrder, Project Settings UI,
  Visibility는 이 계획에 넣지 않는다(다음 계획).
  공통 규칙: 코드 식별자, 주석, 예외·오류 메시지는 영어로 쓴다. Core 코드는 netstandard2.1 API와 C# 9 문법만 쓴다.
  지원하는 이름은 WPF와 같은 의미로 동작해야 하고, 지원하지 않는 값·문법은 조용히 무시하지 않고 오류로 알린다(ADR-004).
  모든 스텝은 dotnet test와 unity test를 둘 다 통과해야 한다. 기존 테스트의 기대값은 스텝 description이 요구사항 변경으로 명시한 것만 바꾼다.
  unity test 실행 중 Unity가 새 파일의 .meta를 만들며, 이 .meta 파일은 커밋 대상이므로 지우지 않는다.
approved: true
max_attempts: 3
ac_timeout_sec: 1200
steps:
  - id: s1-markup-property-elements
    title: support property elements and non-element object elements
    type: feat
    scope: markup
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 1, 2), docs/ADR.md (ADR-003, ADR-004, ADR-012), docs/ARCHITECTURE.md (`Markup` 영역, IR 직렬화 형식),
      unity/Packages/com.loonacia.xamlity/Core/Markup/*.cs (특히 XamlParser.cs, XamlTypeResolver.cs, XamlBuilder.cs, XamlValueConverter.cs),
      Core/Rendering/SolidColorBrush.cs, Core/Layout/Panel.cs, Core/Layout/UIElementCollection.cs, Core/Controls/Border.cs,
      dotnet/Xamlity.Core.Tests/Markup/XamlParserTests.cs, XamlBuilderTests.cs.

      WPF와 같은 프로퍼티 요소 문법을 지원하고, UIElement가 아닌 객체(이 스텝에서는 SolidColorBrush)를 객체 요소로 만들 수 있게 한다.
      IR 형식은 바꾸지 않는다. 프로퍼티 요소는 기존 XamlPropertyNode(TextValue null, Objects에 자식)로 표현된다.

      1. SolidColorBrush: public 매개변수 없는 생성자와 public `Color Color { get; set; }`를 추가한다(기존 `(Color)` 생성자는 유지).
         Brush는 DependencyObject가 아니다. Freezable이 없으므로(ADR-005) 사용 중인 브러시의 Color를 바꿔도 렌더 무효화는 일어나지 않는다.
         이 동작을 바꾸려고 변경 알림을 만들지 마라. 이유: ADR-005가 Freezable을 제외했다.
      2. XamlValueConverter: 대상 타입 `Color` 변환을 추가한다. Brush와 같은 색 문법이며 같은 색 파싱 코드를 재사용한다.
      3. XamlTypeResolver.Resolve: 기본 xmlns에서 `Xamlity.Controls`, `Xamlity.Layout`, `Xamlity.Rendering` 네임스페이스의 public, 비추상 클래스
         (구조체 제외)이면서 public 매개변수 없는 생성자가 있는 타입을 찾는다. UIElement 파생 조건은 없앤다. 대신 파서가 검사한다:
         - 루트 요소는 UIElement여야 한다. 아니면 오류. 이유: XamlAsset.Build가 UIElement를 돌려준다.
         - x:Name은 FrameworkElement에만 허용한다. 아니면 오류. 이유: 빌더가 FrameworkElement.Name에 넣으며 NameScope는 아직 없다.
         - content property 자식(암시적이든 프로퍼티 요소든)의 타입이 대상(단일 값이면 프로퍼티 타입, 컬렉션이면 요소 타입)에 할당 가능하지 않으면 오류.
      4. 프로퍼티 요소 `<Owner.Property>` (XamlParser):
         - Owner는 그 요소 자신의 타입 이름이거나 기반 타입의 이름이어야 한다(`<Border.Background>`). 소유 타입이 다른 프로퍼티 요소
           (`<Grid.Row>`, `<Canvas.Left>` 같은 첨부 프로퍼티 요소)는 지원하지 않는다는 오류로 둔다.
         - 프로퍼티 해석은 속성과 같다(DP 먼저, 없으면 쓰기 가능한 CLR 프로퍼티). 단 컬렉션 프로퍼티(public 인스턴스 CLR 프로퍼티이고 타입이
           `ICollection<T>`를 구현)는 읽기 전용이어도 허용한다.
         - 컬렉션 프로퍼티: 객체 요소 0개 이상, 각각 T에 할당 가능. 단일 값 프로퍼티: 객체 요소 정확히 1개, 프로퍼티 타입에 할당 가능.
         - 프로퍼티 요소에 XML 속성(xmlns 선언 제외)이 있거나, 공백이 아닌 텍스트가 있거나, 프로퍼티 요소 바로 안에 또 프로퍼티 요소가 오면 오류.
         - 같은 프로퍼티를 속성과 프로퍼티 요소로 둘 다 설정하거나, content property를 암시적 자식과 `<Border.Child>`로 둘 다 설정하면
           기존 "set more than once" 오류.
         - IR 노드의 Line/Column은 프로퍼티 요소의 위치다.
         - 기존 content property 판정(`PropertyType == typeof(UIElementCollection)`)을 위의 컬렉션 판정으로 일반화한다.
      5. XamlBuilder: 객체 값 프로퍼티는 DP가 있으면 `SetValue(dp, obj)`, 없으면 CLR setter. 컬렉션 프로퍼티는 프로퍼티 값을 읽어
         `ICollection<T>.Add`로 문서 순서대로 넣는다(MethodInfo 캐시). Reflection.Emit이나 런타임 코드 생성을 쓰지 마라. 이유: ADR-012, IL2CPP.

      기존 테스트 변경(요구사항 변경이므로 허용): XamlParserTests의 `<Border.Child />`, `<Border.Resources />` "Property elements are not supported"
      케이스는 새 동작(빈 단일 값 프로퍼티 요소 오류, 알 수 없는 프로퍼티 오류)을 검증하도록 바꾼다. 다른 기존 기대값은 바꾸지 마라.
      만들지 마라: 첨부 프로퍼티(다음 스텝 s2), 마크업 확장, x:Key·리소스, 텍스트 값을 갖는 프로퍼티 요소(`<TextBlock.Text>abc</TextBlock.Text>`는 오류로 둔다).
      이유: s2이거나 다음 계획 범위다.

      테스트(dotnet/Xamlity.Core.Tests/Markup/):
      - 파서: `<Border.Background><SolidColorBrush Color="#336699"/></Border.Background>`의 IR(프로퍼티 이름, 위치, 자식), 명시적 `<StackPanel.Children>`,
        명시적 `<Border.Child>`, 위 오류 항목 각각의 메시지와 정확한 줄·열, Color 변환기의 정상·오류 입력.
      - 빌더: 위 XAML을 Parse → Serialize → Deserialize → Build 한 뒤 Border.Background가 그 색의 SolidColorBrush이고, Children 순서가 문서 순서이며,
        UIRoot 렌더 시 RecordingDrawingContext의 사각형 색이 맞음.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup/*
      - unity/Packages/com.loonacia.xamlity/Core/Rendering/SolidColorBrush.cs
      - dotnet/Xamlity.Core.Tests/Markup/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s2-core-canvas-attached
    title: add attached properties and Canvas
    type: feat
    scope: core
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-004, ADR-005, ADR-007), docs/ARCHITECTURE.md (`Markup`의 IR 직렬화 형식),
      unity/Packages/com.loonacia.xamlity/Core/Properties/DependencyProperty.cs, DependencyObject.cs, Core/Tree/UIElement.cs (OnPropertyChanged의 무효화),
      Core/Layout/Panel.cs, StackPanel.cs, Core/Markup/*.cs (s1 결과), Editor/XamlImporter.cs,
      dotnet/Xamlity.Core.Tests/Markup/XamlBuilderTests.cs (IR 버전 테스트), Layout/StackPanelTests.cs (테스트 스타일).

      1. DependencyProperty: `public static DependencyProperty RegisterAttached(string name, Type propertyType, Type ownerType, PropertyMetadata defaultMetadata = null)`,
         `internal bool IsAttached`. 검증 규칙과 레지스트리는 Register와 같다(같은 (owner, name)이 이미 있으면 ArgumentException).
         첨부 프로퍼티는 소유 타입과 무관하게 어떤 DependencyObject에도 SetValue할 수 있다(이미 그렇다면 테스트로 고정한다).
      2. Core/Layout/Canvas.cs: `public class Canvas : Panel`, 첨부 DP `Left`, `Top`, `Right`, `Bottom` (double, 기본 NaN, AffectsArrange)과
         WPF와 같은 정적 접근자 `GetLeft(UIElement element)` / `SetLeft(UIElement element, double length)` 등(element가 null이면 ArgumentNullException).
         WPF Canvas 규칙: MeasureOverride는 자식마다 `Measure(new Size(∞, ∞))`하고 (0,0)을 돌려준다. ArrangeOverride는 자식마다 Left가 NaN이 아니면
         x = Left, 아니면 Right가 NaN이 아니면 x = finalSize.Width − 자식 DesiredSize.Width − Right, 둘 다 NaN이면 0이다(Top/Bottom도 같음).
         그다음 `Arrange(new Rect(new Point(x, y), child.DesiredSize))`, 반환은 finalSize.
         자식의 Canvas.Left 변경은 기존 규칙(AffectsArrange → 자식과 조상의 arrange 무효화)으로 Canvas가 다시 배치되게 한다. Canvas 전용 콜백을 만들지 마라.
      3. XAML 첨부 속성(XamlParser): 점이 하나 있는 속성 이름 `Owner.Property`. Owner는 기본 xmlns의 타입으로 해석한다(XamlTypeResolver.Resolve).
         - Owner가 요소 타입에 할당 가능하면(요소 타입이거나 그 기반) 일반 프로퍼티와 똑같이 처리하고 IR에도 일반 프로퍼티로 남긴다
           (`<Border Border.Width="1"/>`은 Width). WPF와 같다.
         - 아니면 `DependencyProperty.FromName(owner, Property)`가 있고 IsAttached여야 한다. 아니면 오류. Owner 타입을 찾지 못하면 알 수 없는 타입 오류.
         - DP 등록은 정적 초기화에 달려 있으므로 조회 전에 소유 타입의 클래스 생성자를 실행한다(XamlTypeResolver.ResolveProperty와 같은 이유.
           빌더도 같다). 이유: 그 타입의 인스턴스가 아직 없으면 FromName이 null을 돌려준다.
         - 점이 없는 속성은 첨부 DP로 해석하지 않는다(`<Canvas Left="5"/>`는 알 수 없는 프로퍼티 오류). 점이 둘 이상이면 오류.
         - 값 검증은 일반 속성과 같은 변환기를 쓴다.
      4. IR 형식 v2: XamlPropertyNode에 `string OwnerTypeName`을 추가한다(첨부 프로퍼티면 `"<CLR 전체 이름>, <어셈블리 이름>"`, 아니면 null).
         직렬화는 PropertyName 바로 뒤에 OwnerTypeName을 같은 문자열 규칙(존재 여부 bool + 문자열)으로 쓴다. FormatVersion을 2로 올린다.
         v1 데이터는 기존 규칙대로 InvalidDataException이다. XamlBuilder는 OwnerTypeName이 있으면 그 타입(캐시)에서 DP를 찾아 SetValue한다.
         Editor/XamlImporter.cs의 `[ScriptedImporter(1, "xaml")]` 버전을 2로 올린다. 이유: 이미 임포트된 v1 IR 에셋을 다시 만들게 한다. 안 하면 런타임 Deserialize가 실패한다.
         docs/ARCHITECTURE.md의 IR 직렬화 형식 문단을 v2(OwnerTypeName 위치 포함)로 고친다.
      기존 테스트 변경(요구사항 변경): XamlParserTests의 `Grid.Row="1"`(이제 알 수 없는 타입 'Grid' 오류. Grid는 s3에서 생긴다)과 `Border.Width="1"`(이제 정상)
      케이스, XamlBuilderTests의 버전 1 바이트 레이아웃·버전 메시지 테스트를 v2에 맞춘다. 다른 기존 기대값은 바꾸지 마라.
      만들지 마라: Grid(s3), Panel.ZIndex, 첨부 프로퍼티 요소 문법, 읽기 전용 DP. 이유: 이후 스텝이거나 PRD 범위 밖이다.

      테스트:
      - dotnet/Xamlity.Core.Tests/Layout/CanvasTests.cs: Left/Top 배치, Right/Bottom 배치, Left와 Right가 둘 다 있으면 Left 우선, 아무것도 없으면 (0,0),
        자식은 무한대로 측정되고 Canvas desired는 (0,0), SetLeft로 한 자식을 옮기면 다른 자식의 ArrangeOverride 호출 횟수는 그대로, 접근자 null 예외.
      - Properties 테스트: RegisterAttached 중복 예외, IsAttached, 소유 타입과 무관한 DependencyObject에 설정·조회.
      - Markup 테스트: `<Canvas><Border Canvas.Left="10" Canvas.Top="20" Width="30" Height="40"/></Canvas>`를 Parse → Serialize → Deserialize → Build →
        UpdateLayout 한 절대 좌표, OwnerTypeName 왕복, 위 오류 항목 각각의 메시지와 줄·열.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Properties/DependencyProperty.cs
      - unity/Packages/com.loonacia.xamlity/Core/Layout/Canvas.cs*
      - unity/Packages/com.loonacia.xamlity/Core/Markup/*
      - unity/Packages/com.loonacia.xamlity/Editor/XamlImporter.cs
      - docs/ARCHITECTURE.md
      - dotnet/Xamlity.Core.Tests/Layout/CanvasTests.cs
      - dotnet/Xamlity.Core.Tests/Properties/*
      - dotnet/Xamlity.Core.Tests/Markup/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s3-core-grid
    title: add Grid with pixel, auto, and star row and column definitions
    type: feat
    scope: core
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 3), docs/ADR.md (ADR-004, ADR-005, ADR-007), unity/Packages/com.loonacia.xamlity/Core/Layout/*.cs
      (특히 Canvas.cs — s2의 첨부 프로퍼티 패턴, UIElementCollection.cs), Core/Tree/FrameworkElement.cs, UIElement.cs, Core/Markup/XamlValueConverter.cs,
      Core/Markup/XamlTypeResolver.cs (s1: 객체 요소 규칙), dotnet/Xamlity.Core.Tests/Layout/CanvasTests.cs, Tree/LayoutTests.cs (고정 크기 테스트 요소).

      WPF Grid를 span 없이 구현한다(RowSpan/ColumnSpan과 정의의 Min/Max는 s4). namespace `Xamlity.Layout`:
      1. `GridUnitType { Auto, Pixel, Star }`, `public readonly struct GridLength : IEquatable<GridLength>`: ctor `(double pixels)`,
         `(double value, GridUnitType type)`, `Value`, `GridUnitType`, `IsAuto`, `IsAbsolute`, `IsStar`, `static GridLength Auto`, ==/!=,
         InvariantCulture ToString("Auto", "*", "2*", "100"). 음수·NaN·무한대 값은 ArgumentException(WPF와 같음).
         XamlValueConverter: "Auto"(대소문자 무시), "*", "2.5*", "100". 단위 접미사는 다른 double처럼 오류.
      2. `RowDefinition`, `ColumnDefinition`: DependencyObject 파생(공통 기반이 필요하면 WPF처럼 public abstract `DefinitionBase`).
         DP `Height` / `Width` (GridLength, 기본 1*). 읽기 전용 CLR `ActualHeight` / `ActualWidth` (마지막 Arrange 결과). DP가 바뀌면 소유 Grid를 InvalidateMeasure.
         ADR-005에 따라 일반 필드나 자동 프로퍼티로 만들지 마라. XAML 객체 요소로 만들 수 있어야 한다(public 매개변수 없는 생성자).
         `RowDefinitionCollection : IList<RowDefinition>`, `ColumnDefinitionCollection : IList<ColumnDefinition>`: 소유 Grid를 기록하고, null이나 다른 Grid에
         속한 정의를 넣으면 예외, 추가·삭제·교체 시 소유 Grid를 InvalidateMeasure. Grid의 `RowDefinitions`, `ColumnDefinitions`는 읽기 전용 CLR 프로퍼티다
         (s1의 컬렉션 프로퍼티 요소로 XAML에서 채워진다).
      3. `public class Grid : Panel`: 첨부 DP `Row`, `Column` (int, 기본 0, AffectsMeasure)과 정적 Get/Set 접근자. 범위를 벗어난 값은 [0, 개수−1]로 고정한다(WPF와 같음).
      4. 레이아웃은 WPF Grid와 같은 결과를 내야 한다. 이 스텝이 지원하는 경우의 규칙:
         - 정의가 행·열 모두 없으면 단일 셀: 모든 자식을 availableSize로 측정, desired는 자식 desired의 최댓값, 모두 finalSize 전체로 배치.
           한쪽만 없으면 그쪽은 1* 정의 하나로 취급한다.
         - 측정 시 그 방향 availableSize가 무한대면 star 정의를 Auto로 취급한다(WPF SizeToContent).
         - 정의별 측정 크기: Pixel은 값, Auto는 ∞(셀 측정 제약), Star는 ResolveStar 결과. 정의별 MinSize: Pixel은 값, 그 밖에는 0에서 시작해 셀 desired의 최댓값.
         - WPF 셀 그룹: group1 = star 행도 star 열도 아님, group3 = star 열이고 star 행이 아님, group2 = star 행이고 Auto 열, group4 = star 행이고 Pixel·star 열.
           순서: group1 측정 → 행 ResolveStar → group2 → 열 ResolveStar → group3 → group4. 셀은 (열 측정 크기, 행 측정 크기)로 측정하고 측정 후 정의 MinSize를 갱신한다.
           WPF의 순환 의존 처리(Auto 행에 group3 셀이 있을 때의 반복 측정)는 만들지 마라. 이유: 고정 크기 콘텐츠에서는 결과가 같고, 서로 크기가 의존하는
           콘텐츠에서만 차이가 나는데 구현 복잡도가 크다.
         - ResolveStar(available): 남는 공간 = max(0, available − Pixel 크기 합 − Auto MinSize 합)을 star 가중치 비율로 나눈다. 가중치 0인 star는 0.
         - desired = 행·열 각각 정의 MinSize의 합.
         - Arrange: Pixel은 값(MinSize 이상), Auto는 MinSize, star는 finalSize에서 비-star 크기 합을 뺀 공간을 가중치로 나누되 MinSize보다 작아지지 않게 하고,
           그 때문에 모자라는 공간은 나머지 star끼리 다시 나눈다(WPF 4.5+ 기본 동작). 정의 오프셋을 누적해 셀 사각형으로 자식을 Arrange하고
           ActualWidth/ActualHeight를 기록한다.
         - 내부 배열은 재사용한다. 변화 없는 두 번째 UpdateLayout은 할당 0.
      만들지 마라: RowSpan/ColumnSpan, 정의 Min/Max(s4), ShowGridLines, SharedSizeGroup, Background. 이유: s4이거나 PRD 범위 밖이다.

      테스트 dotnet/Xamlity.Core.Tests/Layout/GridTests.cs (고정 콘텐츠 크기 테스트 요소):
      - 300x200 viewport, 열 "100, Auto, *", 행 "Auto, *, 2*", 자식 A(40x20, Row0 Col1), B(10x10, Row2 Col2, Stretch), C(30x30, Row1 Col0, Left/Top):
        열 ActualWidth 100/40/160, 행 ActualHeight 20/60/120, A VisualOffset (100,0), B (140,80)이고 RenderSize 160x120, C (0,20), Grid DesiredSize (150,60).
      - 무한 폭(가로 StackPanel 안), 열 "*, 2*", 자식 50x10(Col0)·30x10(Col1): Grid desired 폭 80, 배치 후 열 50/30.
      - 정의 없는 단일 셀, 한쪽만 정의, Row/Column 범위 밖 고정, 가중치 0 star, 내용 없는 star 열은 desired에 기여 0.
      - 무효화: Grid.SetRow 변경, ColumnDefinition.Width 변경, 정의 추가·삭제가 재측정을 일으킴. 변화 없는 UpdateLayout 할당 0.
      - 다른 Grid에 속한 정의 추가 예외, GridLength 생성자 예외와 ToString, 변환기 정상·오류 입력.
      - XAML 끝에서 끝까지: `<Grid.ColumnDefinitions>`·`<Grid.RowDefinitions>`와 `Grid.Row`·`Grid.Column`이 있는 문서 → Build → UpdateLayout → 절대 좌표.
    expected_files:
