      - unity/Packages/com.loonacia.xamlity/Tests/Editor/RenderingTests.cs
      - dotnet/Xamlity.Core.Tests/Rendering/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s8-unity-reference-resolution
    title: scale logical pixels to the root's reference resolution
    type: feat
    scope: unity
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 12), docs/ARCHITECTURE.md (횡단 관심사 > 좌표와 해상도), unity/Packages/com.loonacia.xamlity/Runtime/XamlityRoot.cs,
      Runtime/MeshDrawingContext.cs (s6·s7의 불투명도·클립 스택), Tests/Editor/RenderingTests.cs, SampleSetupTests.cs.

      1. XamlityRoot: `[SerializeField] private Vector2Int referenceResolution = new Vector2Int(1920, 1080);`와 테스트용 internal 접근자.
         배율 s = min(pixelWidth / 기준 폭, pixelHeight / 기준 높이) — 기준 해상도 전체가 화면 안에 들어가게 맞추는 비율이다.
         논리 viewport = (pixelWidth / s, pixelHeight / s)이고 UpdateLayout은 논리 크기로 한다. 기준 해상도 성분이 0 이하면 배율 1이다.
         픽셀 크기나 배율이 바뀌면 기존 리사이즈 처리처럼 렌더를 무효화한다. 마지막 배율을 테스트가 읽을 수 있게 internal로 둔다.
      2. MeshDrawingContext.Begin에 배율을 넘긴다. 모든 좌표(사각형, 글리프 위치·크기, 클립 사각형)에 논리 → 픽셀 배율을 적용한 뒤 y를 뒤집는다.
         글자 측정(TmpTextMeasurer)과 Core 레이아웃은 논리 단위 그대로다. Core 코드를 바꾸지 마라. 이유: 배율은 어댑터의 좌표 변환이다(ARCHITECTURE 좌표와 해상도).
      3. 기존 테스트: RenderingTests의 루트 생성 도우미에서 기준 해상도를 렌더 타깃 크기(256x128)로 설정해 배율 1을 만들고 기존 기대값은 그대로 둔다.
         MeshDrawingContext를 직접 쓰는 단위 테스트는 배율 1을 넘긴다. 이것 말고 기존 테스트의 기대값을 바꾸지 마라.
      4. docs/ARCHITECTURE.md "좌표와 해상도"에 배율 규칙(min 비율, 논리 viewport, 기본 1920x1080)을 짧게 적는다.
      만들지 마라: sortingOrder, 맞춤 모드 선택(matchWidthOrHeight 등), 픽셀 스냅, Project Settings UI. 이유: 이 계획 범위 밖이다.

      테스트(RenderingTests.cs에 추가):
      - 기준 1920x1080에서 Refresh(3840, 2160) → 배율 2, TopBand(Height 64) 메시의 띠 높이 128px. Refresh(2560, 1080) → 배율 1, 루트 요소 RenderSize 2560x1080.
        Refresh(960, 540) → 배율 0.5, 같은 TextBlock의 글리프 쿼드 크기가 배율 1일 때의 절반. 클립 사각형에도 배율 적용.
      - 픽셀: 256x128 타깃, 기준 512x256 → 배율 0.5 → TopBand 띠가 위 32px만 빨강이고 나머지는 검정.
      - 배율이 바뀌면 메시를 다시 만들고, 변화 없는 두 번째 Refresh는 다시 만들지 않으며 할당 0.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlityRoot.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/RenderingTests.cs
