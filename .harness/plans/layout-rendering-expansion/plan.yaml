      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s9-core-corner-radius
    title: add Border CornerRadius with rounded drawing commands
    type: feat
    scope: core
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-004, ADR-005), unity/Packages/com.loonacia.xamlity/Core/Controls/Border.cs, Core/Layout/Thickness.cs (구조체 스타일),
      Core/Markup/XamlValueConverter.cs (Thickness 변환기), Core/Rendering/IDrawingContext.cs, Core/Tree/UIRoot.cs, Runtime/MeshDrawingContext.cs,
      dotnet/Xamlity.Core.Tests/Rendering/BorderRenderingTests.cs, RecordingDrawingContext.cs, EmptyDrawingContext.cs.

      1. Core/Layout/CornerRadius.cs: `public readonly struct CornerRadius : IEquatable<CornerRadius>` — ctor `(double uniformRadius)`,
         `(double topLeft, double topRight, double bottomRight, double bottomLeft)`, 같은 이름의 프로퍼티, ==/!=, InvariantCulture ToString.
         생성자는 값을 검증하지 않는다(WPF 구조체와 같음).
         변환기: "a" 또는 "a,b,c,d"(쉼표나 공백 구분, WPF CornerRadiusConverter처럼 값 1개 또는 4개만). 음수·NaN·무한대는 오류
         (WPF Border의 값 검증과 같은 결과를 임포트 시점에 낸다).
      2. Border DP `CornerRadius` (기본 0, AffectsMeasure|AffectsRender — WPF와 같음).
      3. IDrawingContext:
         - `void DrawRoundedRectangle(Brush brush, Rect rectangle, CornerRadius cornerRadius)` — 둥근 사각형 채우기.
         - `void DrawRoundedBorder(Brush brush, Rect outerRectangle, CornerRadius outerCornerRadius, Rect innerRectangle, CornerRadius innerCornerRadius)` —
           바깥 모양에서 안쪽 모양을 뺀 영역 채우기. 안쪽 사각형의 폭이나 높이가 0이면 바깥 모양 전체.
         모서리는 원형이다. 넘겨지는 반지름은 각 변에서 이웃한 두 반지름의 합이 그 변 길이를 넘지 않는다(호출자가 보장). OffsetDrawingContext는 사각형을 절대 좌표로 옮겨 전달한다.
      4. Border.OnRender: 네 반지름이 모두 0이면 기존 경로 그대로(명령과 순서 불변). 아니면 WPF Border 규칙을 원형 모서리로 옮긴다:
         - 바깥 사각형 (0,0,W,H), 안쪽 사각형은 BorderThickness만큼 줄인 사각형.
         - 모서리마다 t = 그 모서리에 닿는 두 변 두께 중 큰 값의 절반. 바깥 반지름 = r == 0 ? 0 : r + t, 안쪽 반지름 = max(0, r − t).
           두께가 균일하면 WPF와 정확히 같고, 균일하지 않으면 WPF의 타원 모서리를 원형으로 근사한다(알려진 차이).
         - 한 사각형의 반지름 합이 변 길이를 넘으면 그 사각형의 네 반지름에 같은 배율 min(변 길이 / 이웃 반지름 합)을 곱한다(CSS 규칙).
           이유: WPF는 변마다 타원으로 나누지만 원형 모서리만 지원하므로.
         - BorderBrush가 있고 두께 중 하나라도 0보다 크면 DrawRoundedBorder, 그다음 Background가 있고 안쪽 사각형이 비어 있지 않으면
           DrawRoundedRectangle(안쪽 사각형, 안쪽 반지름). 기존처럼 테두리 먼저, 배경 나중.
      5. Runtime/MeshDrawingContext.cs에 두 메서드를 빈 본문으로 추가해 Unity 컴파일을 유지한다. 다음 스텝 s10이 구현한다. 다른 Unity 코드는 건드리지 마라.
      만들지 마라: 타원 모서리, 둥근 클립. 이유: 원형 모서리 SDF(s10)로 v1을 충분히 표현한다.

      테스트(dotnet/Xamlity.Core.Tests/Rendering/CornerRadiusTests.cs 또는 BorderRenderingTests.cs): 구조체 동등성·ToString, 변환기 정상·오류 입력;
      균일 두께 2·반지름 8 → 바깥 반지름 9, 안쪽 7과 두 사각형; 두께 0이면 테두리 명령 없이 배경만; BorderBrush만 있으면 테두리만;
      40x20 Border에 반지름 20(두께 0) → 배경 반지름 10; 비균일 두께의 근사 값; 반지름 0이면 기존 명령 그대로; 중첩 Border 절대 좌표; 변화 없는 Render 할당 0.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Layout/CornerRadius.cs*
      - unity/Packages/com.loonacia.xamlity/Core/Markup/XamlValueConverter.cs
      - unity/Packages/com.loonacia.xamlity/Core/Controls/Border.cs
      - unity/Packages/com.loonacia.xamlity/Core/Rendering/IDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIRoot.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs
      - dotnet/Xamlity.Core.Tests/Rendering/*
      - dotnet/Xamlity.Core.Tests/Markup/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s10-unity-rounded-rect
    title: draw rounded rectangles with an SDF solid shader
    type: feat
    scope: unity
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md (레이어 규칙의 메시 배치·셰이더), unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs
      (s6 불투명도, s7 CPU 클립, s8 배율), Runtime/Shaders/XamlitySolid.shader, XamlityText.shader, Runtime/XamlityRendererFeature.cs,
      Core/Rendering/IDrawingContext.cs, Core/Controls/Border.cs (s9의 반지름 규칙), Tests/Editor/RenderingTests.cs.

      1. MeshDrawingContext.DrawRoundedRectangle / DrawRoundedBorder: 바깥 사각형을 덮는 쿼드 하나를 solid 배치에 넣는다. 기존 Xamlity/Solid 머티리얼을 쓴다.
         이유: 둥근 사각형과 일반 사각형이 번갈아 나와도 배치가 끊기지 않게 한다. 모양 정보는 정점 UV 채널(TEXCOORD1~4, Vector4)로 넘긴다:
         바깥 사각형 중심 기준 로컬 픽셀 좌표와 바깥 반폭·반높이, 바깥 네 반지름, 안쪽 사각형의 중심 오프셋과 반폭·반높이(안쪽이 없으면 그렇게 표시),
         안쪽 네 반지름. 모든 값은 s8 배율을 적용한 픽셀 단위다. DrawRectangle과 글리프 쿼드는 이 채널을 "모양 없음"으로 채운다.
         모든 정점이 같은 채널을 갖게 하고 리스트는 재사용한다.
      2. Xamlity/Solid 셰이더: 모양 정보가 없으면 지금처럼 커버리지 1이다(기존 픽셀 결과 불변). 있으면 모서리별 반지름을 쓰는 rounded box SDF로
         바깥 커버리지 = saturate(0.5 − d_outer), 안쪽이 있으면 × saturate(0.5 + d_inner)(1픽셀 안티에일리어싱)를 알파에 곱한다. Xamlity/Text는 바꾸지 마라.
      3. s7 CPU 클립이 모양 쿼드에도 맞게 동작해야 한다: 쿼드를 자를 때 로컬 좌표 채널을 위치와 같은 양만큼 옮긴다. 나머지 모양 채널은 그대로 둔다.
         불투명도(s6)는 정점 알파로 그대로 적용된다.
      만들지 마라: 타원 모서리, 그림자, 그라디언트. 이유: PRD 범위 밖이다.

      테스트(RenderingTests.cs, 필요하면 픽스처 Tests/Editor/TestAssets/RoundedBorder.xaml):
      - MeshDrawingContext 단위: 둥근 쿼드의 정점 4개와 채널 값, 사각형·글리프 정점의 "모양 없음" 채널, 둥근 사각형이 앞뒤 사각형과 같은 solid 배치에 묶임,
        클립된 둥근 쿼드의 로컬 좌표가 위치와 함께 옮겨짐, 배율 2에서 반지름도 2배.
      - 픽셀(256x128, 검정 배경, 배율 1, UI 좌표 (x, y)는 텍스처에서 (x, 127 − y)): 왼쪽 위 64x64 Border, Background 빨강, CornerRadius 16 —
        중심 빨강, UI (1,1) 검정, 위 변 중앙 UI (32,0) 빨강. BorderThickness 4·BorderBrush 흰색·Background 빨강·CornerRadius 16 — UI (32,2) 흰색,
        UI (32,10) 빨강, UI (1,1) 검정.
      - 기존 빨강 띠·회색·한글·불투명도·클립 픽셀 테스트와 할당 0 테스트가 기대값을 바꾸지 않고 통과.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/Shaders/XamlitySolid.shader
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/RenderingTests.cs
