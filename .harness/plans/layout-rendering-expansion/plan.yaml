  - id: s11-core-image
    title: add Image with Stretch and DrawImage
    type: feat
    scope: core
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 4의 Image), docs/ADR.md (ADR-004), unity/Packages/com.loonacia.xamlity/Core/Rendering/FontHandle.cs,
      IDrawingContext.cs, Core/Controls/TextBlock.cs (DP와 측정 패턴), Core/Tree/FrameworkElement.cs (s7 레이아웃 클립), UIRoot.cs,
      Core/Markup/XamlValueConverter.cs, Runtime/MeshDrawingContext.cs, dotnet/Xamlity.Core.Tests/Rendering/*.

      1. Core/Rendering/ImageSource.cs: `public abstract class ImageSource { public abstract double Width { get; } public abstract double Height { get; } }`
         (논리 픽셀, WPF ImageSource와 같은 이름). 엔진 어댑터가 상속한다(s12).
         Core/Rendering/Stretch.cs: `Stretch { None, Fill, Uniform, UniformToFill }` (WPF System.Windows.Media.Stretch와 같은 멤버·순서).
      2. IDrawingContext `void DrawImage(ImageSource imageSource, Rect rectangle)` (WPF DrawingContext.DrawImage와 같은 시그니처). OffsetDrawingContext는 절대 좌표로 전달.
      3. Core/Controls/Image.cs `public class Image : FrameworkElement`: DP `Source` (ImageSource, null, AffectsMeasure|AffectsRender), `Stretch` (기본 Uniform, AffectsMeasure).
         WPF Image.MeasureArrangeHelper + Viewbox.ComputeScaleFactor(StretchDirection.Both)와 같은 계산: Source가 없으면 (0,0). 크기 = (Source.Width, Source.Height) × 배율.
         Stretch가 None이 아니고 제약이 한쪽이라도 유한하면 sx = 제약 폭 / 폭, sy = 제약 높이 / 높이(콘텐츠 크기가 0이면 0). 폭이 무한대면 sx = sy,
         높이가 무한대면 sy = sx, 둘 다 유한하면 Uniform은 min, UniformToFill은 max, Fill은 각각. 그 밖에는 배율 1.
         MeasureOverride는 availableSize로, ArrangeOverride는 finalSize로 같은 계산을 한다. OnRender: Source가 있으면 `DrawImage(Source, new Rect(0, 0, RenderSize))`.
         UniformToFill로 슬롯보다 커진 부분은 s7 레이아웃 클립이 자른다(Stretch 정렬은 WPF처럼 넘치면 왼쪽 위 기준).
      4. XAML의 `Source="..."` 문자열은 아직 변환하지 않는다(기존 "Cannot convert text to type" 오류 그대로). 에셋 경로 해석은 s13이다.
      5. Runtime/MeshDrawingContext.cs에 DrawImage를 빈 본문으로 추가해 Unity 컴파일을 유지한다. s12가 구현한다. 다른 Unity 코드는 건드리지 마라.
      만들지 마라: StretchDirection, ImageBrush, BitmapImage 같은 ImageSource 구현, 9-slice 프로퍼티. 이유: PRD 범위 밖이고, 9-slice는 Sprite 에셋의 border로
      어댑터가 처리한다(s12). ADR-004: WPF에 없는 프로퍼티를 만들지 않는다.

      테스트 dotnet/Xamlity.Core.Tests/Rendering/ImageTests.cs (테스트 전용 FakeImageSource 100x50):
      None → 100x50; 200x200 슬롯에서 Fill → 200x200, Uniform → 200x100, UniformToFill → RenderSize 400x200이고 PushClip (0,0,200,200);
      Height 80인 가로 StackPanel 안 Uniform → 160x80; 크기 0 소스; Source null이면 (0,0)이고 명령 없음; Source·Stretch 변경이 재측정을 일으킴;
      Border 안 Image의 DrawImage 절대 좌표; 변화 없는 Render 할당 0. Image 요소를 XAML로 만들 수 있음(Source 없이).
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Rendering/ImageSource.cs*
      - unity/Packages/com.loonacia.xamlity/Core/Rendering/Stretch.cs*
      - unity/Packages/com.loonacia.xamlity/Core/Rendering/IDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Core/Controls/Image.cs*
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIRoot.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs
      - dotnet/Xamlity.Core.Tests/Rendering/*
    ac:
