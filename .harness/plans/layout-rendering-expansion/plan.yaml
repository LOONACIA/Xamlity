      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s12-unity-image-render
    title: draw textures and 9-slice sprites for Image
    type: feat
    scope: unity
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-001: UnityEngine.UI 금지, ADR-009), docs/ARCHITECTURE.md (레이어 규칙), unity/Packages/com.loonacia.xamlity/Core/Rendering/ImageSource.cs,
      Core/Controls/Image.cs, Runtime/MeshDrawingContext.cs, XamlityRendererFeature.cs, Runtime/Shaders/*.shader,
      Tests/Editor/RenderingTests.cs (CreateCamera의 피처·셰이더 검사), unity/Assets/Settings/PC_Renderer.asset, Mobile_Renderer.asset.

      1. Runtime/UnityImageSource.cs: `public sealed class UnityImageSource : ImageSource`, ctor `(Texture2D texture)`, `(Sprite sprite)` (null이면 ArgumentNullException),
         읽기 프로퍼티 `Texture`, `Sprite`. Width/Height는 Sprite면 `sprite.rect` 크기, 아니면 텍스처 크기(텍스처 픽셀 = 논리 픽셀).
      2. MeshDrawingContext.DrawImage: Source가 UnityImageSource가 아니면 그리지 않는다. 배치 키에 종류(solid/text/image)를 넣고 image 배치는 텍스처별로 묶는다.
         정점 색은 흰색 × 현재 불투명도. Texture2D는 UV (0,0)~(1,1). Sprite는 `sprite.texture`와 `UnityEngine.Sprites.DataUtility.GetOuterUV(sprite)`
         (아틀라스에 패킹된 스프라이트 포함). `sprite.border`(x 왼쪽, y 아래, z 오른쪽, w 위, 스프라이트 픽셀)가 0이 아니면 9-slice:
         가장자리 크기는 border(논리 픽셀 × s8 배율)로 유지하고 가운데와 변을 늘린다. 안쪽 UV는 `DataUtility.GetInnerUV`. 대상 폭이 왼쪽+오른쪽보다 작으면
         두 값을 비율대로 줄인다(높이도 같음, uGUI Sliced와 같은 결과). 크기 0인 조각은 만들지 않는다. s7 CPU 클립과 s8 배율이 이미지 쿼드에도 적용된다.
         UnityEngine.UI를 참조하지 마라(ADR-001). DataUtility는 UnityEngine.CoreModule의 UnityEngine.Sprites 네임스페이스다.
      3. Runtime/Shaders/XamlityImage.shader (`Xamlity/Image`): 텍스처 샘플 × 정점 색. 정점 색은 다른 셰이더처럼 Linear 프로젝트에서 sRGB → linear.
         블렌드·깊이·컬 설정은 Xamlity/Solid와 같다. XamlityRendererFeature에 `[SerializeField] private Shader imageShader`와 머티리얼을 추가하고
         image 배치는 `_MainTex`를 MaterialPropertyBlock으로 넘긴다. 샘플 렌더러 에셋 두 개에 셰이더를 연결한다(YAML 직접 수정 가능).
         RenderingTests.CreateCamera의 셰이더 검사에 imageShader를 추가한다.
      4. docs/ARCHITECTURE.md 레이어 규칙의 셰이더 문장에 이미지는 `Xamlity/Image`를 쓴다고 추가한다.
      만들지 마라: Tiled·Filled 같은 uGUI Image 모드, 스프라이트 메시(Tight) 그리기, 텍스처 로딩. 이유: PRD 범위 밖이다.

      테스트(Tests/Editor/ImageRenderingTests.cs, 기존 RenderingTests의 카메라·픽셀 도우미는 복사하지 말고 공유할 수 있게 옮기거나 같은 클래스에 추가한다):
      메모리 텍스처(`new Texture2D`, Point 필터)와 `Sprite.Create(texture, rect, pivot, 100, 0, SpriteMeshType.FullRect, border)`를 쓴다.
      - 단위: Texture2D 쿼드 UV; 텍스처 일부 rect로 만든 Sprite의 UV; border (4,4,4,4)인 16x16 Sprite를 64x32로 그리면 쿼드 9개와 기대 위치·UV;
        대상 6x6이면 가장자리 축소; 이미지가 solid·text와 다른 배치이고 같은 텍스처가 연속하면 묶임; 불투명도 알파; 클립된 이미지 UV; 배율 2.
      - 픽셀: 왼쪽 픽셀 빨강·오른쪽 픽셀 초록인 2x1 텍스처를 Image(Stretch=Fill, 64x32, 왼쪽 위)로 그리면 x < 32 빨강, 32 ≤ x < 64 초록, 그 밖은 검정.
        가장자리와 가운데 색이 다른 9-slice 스프라이트 픽셀 하나. 변화 없는 Refresh 할당 0.
      - 테스트가 만든 텍스처·스프라이트는 TearDown에서 정리한다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Runtime/UnityImageSource.cs*
      - unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlityRendererFeature.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/Shaders/XamlityImage.shader*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/RenderingTests.cs
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/ImageRenderingTests.cs*
      - unity/Assets/Settings/PC_Renderer.asset
      - unity/Assets/Settings/Mobile_Renderer.asset
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s13-editor-image-assets
    title: resolve Image source asset paths at import time
    type: feat
    scope: editor
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 1: 잘못된 에셋 경로는 임포트 오류), docs/ADR.md (ADR-003의 의존성 규칙, ADR-011의 OnImportAsset 금지 사항),
      docs/ARCHITECTURE.md (데이터 흐름 > 에디터: 임포트), unity/Packages/com.loonacia.xamlity/Core/Markup/XamlParser.cs, XamlParseResult.cs, XamlBuilder.cs,
      XamlValueConverter.cs, Runtime/XamlAsset.cs, Runtime/UnityImageSource.cs (s12), Editor/XamlImporter.cs, Tests/Editor/XamlImporterTests.cs (임시 폴더 방식).

      설계: IR에는 원문 문자열(경로)을 그대로 두고, XamlAsset이 "원문 값 → UnityEngine.Object" 참조 테이블을 갖는다. 런타임 빌더는 주입된 해석기로
      원문 값을 ImageSource로 바꾼다. 이유: ARCHITECTURE의 "값은 파서가 보존한 원문 문자열" 규칙과 IR 형식(v2)을 그대로 유지한다.
      docs/ARCHITECTURE.md 데이터 흐름의 "에셋 경로 → UnityEngine.Object 참조 (IR 안에서는 인덱스)"를 이 설계로 고친다.
      1. Core/Markup:
         - `public interface IXamlAssetResolver { ImageSource ResolveImage(string value); }`
         - `XamlBuilder.Build(XamlDocument document, IXamlAssetResolver assetResolver)` 오버로드(기존 `Build(document)`는 null 해석기).
           ImageSource 타입 프로퍼티는 해석기로 값을 만든다. 해석기가 null이면 XamlBuildException(줄·열).
         - 파서: ImageSource 타입 속성 값은 비어 있지 않고 마크업 확장이 아니면 통과시키고(빈 값은 오류), `XamlParseResult.AssetReferences`
           (`IReadOnlyList<XamlAssetReference>`, 항목 `string Value`, `int Line`, `int Column`)에 문서 순서로 기록한다. 존재 확인은 Core가 하지 않는다(엔진 정보가 없다).
      2. Editor/XamlImporter: 파싱 오류가 없으면 참조마다 경로를 해석한다. `Assets/`나 `Packages/`로 시작하면 프로젝트 경로, 아니면 XAML 파일이 있는 폴더 기준
         상대 경로('/' 구분, `./`·`../` 정규화). `/`로 시작하거나 `:`가 들어간 URI 형식이면 오류.
         `AssetDatabase.LoadAllAssetsAtPath`로 읽은 객체에서 고르는 규칙은 테스트 가능한 internal static 함수로 분리한다(예: `TrySelectImageAsset(Object[] assets,
         out Object selected, out string error)`): Sprite가 정확히 하나면 그 Sprite, Sprite가 없고 메인이 Texture2D면 텍스처, Sprite가 여러 개면 오류
         (스프라이트 시트는 지원하지 않음), 에셋이 없거나 다른 타입이면 오류.
         오류 형식은 기존과 같은 `파일(줄,열): 메시지`이고, 오류가 하나라도 있으면 IR 없는 XamlAsset을 넣는다(기존 규칙).
         참조한 경로마다 의존성을 등록한다: 에셋이 있으면 `ctx.DependsOnArtifact(path)`, 없으면 `ctx.DependsOnSourceAsset(path)` (나중에 그 에셋이 생기면 재임포트되도록, ADR-003).
         같은 원문 값은 테이블에 한 번만 넣는다. OnImportAsset 안에서 파일을 쓰거나 CreateAsset/ImportAsset을 부르지 마라(ADR-011).
      3. Runtime/XamlAsset: `[SerializeField] private string[] assetKeys`, `[SerializeField] private Object[] assets`,
         `internal void Initialize(byte[] ir, string[] assetKeys, Object[] assets)`(기존 1인자 Initialize는 이 시그니처로 바꾸고 호출부를 고친다).
         Build()는 테이블로 `UnityImageSource`를 만드는 해석기를 넘긴다. 테이블에 없거나 참조가 끊긴(null) 값은 `Debug.LogWarning` 후 Source null.
      만들지 마라: 스프라이트 시트의 이름 선택 문법, URI(pack://) 지원, FontFamily 에셋 참조, 런타임 경로 로딩(Resources/Addressables). 이유: 이 계획 범위 밖이다.

      테스트:
      - Core(dotnet Markup 테스트): AssetReferences 기록과 줄·열, 빈 값 오류, 해석기 호출과 결과 설정, 해석기 없이 Build하면 XamlBuildException.
      - Unity(XamlImporterTests.cs): 테스트가 `Assets/XamlityTestTemp/`에 PNG(Texture2D.EncodeToPNG)를 쓰고 TextureImporter로 Sprite(Single, border)로 설정해 임포트한 뒤
        상대 경로와 `Assets/...` 경로 모두 HasIr이고 Build한 Image.Source가 그 Sprite의 UnityImageSource; Sprite가 아닌 텍스처는 Texture;
        없는 경로와 `/abs.png`는 줄·열이 있는 오류이고 HasIr false; 선택 함수에 메모리 Sprite 두 개를 넘기면 여러 Sprite 오류;
        없는 경로를 참조하던 XAML은 그 경로에 PNG를 만들고 `AssetDatabase.Refresh()` 하면 다시 임포트되어 HasIr이 된다.
        자동 재임포트가 되지 않으면 테스트를 약화하지 말고 blockers에 적는다. TearDown에서 임시 폴더를 지운다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup/*
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlAsset.cs
      - unity/Packages/com.loonacia.xamlity/Editor/XamlImporter.cs
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/XamlImporterTests.cs
      - dotnet/Xamlity.Core.Tests/Markup/*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

