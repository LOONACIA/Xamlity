  - id: s4-core-grid-spans
    title: support Grid spans and definition min and max constraints
    type: feat
    scope: core
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-004), unity/Packages/com.loonacia.xamlity/Core/Layout/Grid.cs, RowDefinition*.cs, ColumnDefinition*.cs (s3),
      dotnet/Xamlity.Core.Tests/Layout/GridTests.cs.

      s3 Grid에 span과 정의 제약을 더한다. WPF Grid와 같은 결과를 내야 한다.
      1. 첨부 DP `Grid.RowSpan`, `Grid.ColumnSpan` (int, 기본 1, AffectsMeasure)과 정적 접근자. 1보다 작으면 1, 시작 인덱스부터 남은 정의 수를 넘으면 그 수로 고정한다.
      2. 정의 DP `RowDefinition.MinHeight`(0) / `MaxHeight`(∞), `ColumnDefinition.MinWidth` / `MaxWidth` (double, 바뀌면 소유 Grid InvalidateMeasure).
         Pixel: 크기와 MinSize 모두 clamp(값, Min, Max). Auto: MinSize는 Min 이상이고, 셀 desired는 `Math.Min(desired, Max)`로 반영한다(WPF UpdateMinSize).
         Star: ResolveStar와 Arrange에서 Min/Max를 지킨다.
      3. 셀 분류에 span 반영: 범위 안에 star 정의가 하나라도 있으면 star 셀, Auto가 하나라도 있으면 Auto 셀이다(group2 조건은 "Auto 열이 있고 star 열이 없음").
         셀 측정 제약은 범위 안 정의 측정 크기의 합이다.
      4. span이 2 이상인 셀의 desired는 그 그룹 측정이 끝난 뒤, span 길이가 짧은 것부터 WPF `EnsureMinSizeInDefinitionRange`와 같은 규칙으로 범위 안 정의의
         MinSize에 나눠 넣는다: 요청 크기 ≤ 범위 MinSize 합이면 그대로. ≤ preferred 합(Auto는 MinSize, 그 밖에는 max(MinSize, 측정 크기))이면 Auto는 그대로 두고
         비-Auto 정의를 preferred를 넘지 않게 균등히 늘린다. ≤ max 합(정의마다 max(Max, MinSize))이면 비-Auto 정의를 max 한도 안에서 먼저 균등히 늘리고 남으면
         Auto 정의에 균등히 나눈다. 그보다 크면 모든 정의에 균등히 나눈다(WPF의 maxMaxSize 보정 포함).
      5. star 분배(ResolveStar와 Arrange)는 Min/Max를 지키는 WPF 4.5+ 기본 알고리즘(ResolveStarMaxDiscrepancy, SetFinalSizeMaxDiscrepancy)과 같은 결과를 낸다:
         비례 배분 결과가 Min보다 작거나 Max보다 큰 정의를 그 한계로 고정하고, 남은 공간을 나머지 star끼리 다시 비례 배분한다.
      만들지 마라: 순환 의존 반복 측정, SharedSizeGroup, ShowGridLines. 이유: s3와 같다.

      테스트(GridTests.cs에 추가):
      - 열 "Auto, Auto", Col0 자식 폭 30, Col0부터 ColumnSpan=2인 자식 폭 100 → 열 65/35. 같은 구성의 RowSpan → 행 65/35.
      - span이 범위를 넘거나 0 이하이면 고정.
      - 폭 300, star 열 3개 중 첫 열 MaxWidth=50 → 50/125/125. star 열 2개 중 첫 열 MinWidth=200 → 200/100.
      - Pixel 100에 MaxWidth=60 → 60. Auto에 MinWidth=80, 내용 30 → 80. Auto에 MaxWidth=20, 내용 30 → 20(넘친 내용의 클립은 s7).
      - star 열을 지나는 span 셀이 group 분류를 바꾸는 경우의 좌표, Min/Max 변경이 재측정을 일으킴, 변화 없는 UpdateLayout 할당 0.
      - XAML 끝에서 끝까지 `Grid.ColumnSpan` 하나.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Layout/Grid.cs
      - unity/Packages/com.loonacia.xamlity/Core/Layout/RowDefinition*
      - unity/Packages/com.loonacia.xamlity/Core/Layout/ColumnDefinition*
      - unity/Packages/com.loonacia.xamlity/Core/Layout/DefinitionBase*
      - dotnet/Xamlity.Core.Tests/Layout/GridTests.cs
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s5-core-text-wrapping
    title: wrap and align multi-line TextBlock text
    type: feat
    scope: core
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-004, ADR-010: 텍스트 레이아웃은 Core가 한다), docs/ARCHITECTURE.md (횡단 관심사 > 성능),
      unity/Packages/com.loonacia.xamlity/Core/Controls/TextBlock.cs, Core/Rendering/GlyphRun.cs, ITextMeasurer.cs,
      dotnet/Xamlity.Core.Tests/Rendering/TextBlockTests.cs (FakeTextMeasurer: advance = fontSize×0.5, Ascent = 0.8×fontSize, LineHeight = 1.2×fontSize).

      1. namespace `Xamlity.Controls`: `TextWrapping { WrapWithOverflow, NoWrap, Wrap }`, `TextAlignment { Left, Right, Center, Justify }`
         (WPF와 같은 멤버와 순서).
      2. TextBlock DP `TextWrapping` (기본 NoWrap, AffectsMeasure|AffectsRender), `TextAlignment` (기본 Left, AffectsMeasure|AffectsRender|Inherits. WPF와 같음).
      3. 줄 나누기 규칙:
         - "\r\n", "\n", "\r"은 모든 모드에서 강제 줄바꿈이고 글리프로 측정하지 않는다(measurer에 넘기지 않는다).
         - 줄바꿈 기회는 공백(U+0020) 뒤뿐이다. 한글도 공백(단어) 단위로 나뉜다. CJK 글자 사이 줄바꿈, 하이픈, UAX #14는 만들지 마라.
           이유: v1은 한글 단어 단위 줄바꿈으로 충분하고 PRD가 복잡한 스크립트 처리를 범위 밖에 두었다.
         - Wrap/WrapWithOverflow: 다음 단어를 붙이면 줄 폭이 제약 폭을 넘을 때 그 단어 앞(앞 공백 뒤)에서 나눈다. 줄 끝 공백은 폭을 넘어도 그 줄에 매달린다.
           단어 하나가 제약 폭보다 길면 Wrap은 코드 포인트 경계에서 자르고(한 줄에 최소 한 글자), WrapWithOverflow는 자르지 않고 넘친다.
         - 소프트 줄바꿈 지점의 끝 공백은 그 줄의 폭과 GlyphRun에서 뺀다. 강제 줄바꿈으로 끝나는 줄과 NoWrap 줄의 끝 공백은 지금처럼 폭에 포함한다.
         - 제약 폭이 무한대면 소프트 줄바꿈이 없다. 빈 문자열은 높이 LineHeight인 한 줄(기존과 같음). 연속 줄바꿈이 만든 빈 줄도 한 줄 높이를 차지한다.
      4. 측정: desired = (가장 긴 줄 폭, 줄 수 × LineHeight). 줄 나누기는 MeasureOverride의 availableSize.Width로 한다.
         ArrangeOverride를 추가해, 줄바꿈 모드이고 finalSize.Width가 줄을 나눈 폭과 다르면 그 폭으로 다시 나눈다(WPF TextBlock과 같음). 반환은 finalSize.
      5. 그리기: 줄마다 GlyphRun 하나(글리프가 없는 줄도 빈 GlyphRun, 기존 빈 텍스트 동작과 같음), `DrawGlyphRun(Foreground, run, new Point(x, Ascent + i × LineHeight))`.
         x는 RenderSize.Width(W) 기준 정렬: Left 0, Right W − 줄 폭, Center (W − 줄 폭) / 2. Justify는 마지막 줄과 강제 줄바꿈으로 끝나는 줄은 Left로 두고,
         나머지 줄은 줄 안쪽 공백 글리프의 advance를 균등히 늘려 W를 채운다(공백이 없으면 Left). x가 음수가 되어도 그대로 둔다(넘친 텍스트의 클립은 s7).
      6. 성능: Text·FontSize·폰트·측정기·줄바꿈 모드·줄을 나눈 폭이 같으면 줄 레이아웃과 GlyphRun을 다시 만들지 않는다. 정렬만 바뀌면 줄을 다시 나누지 않는다
         (Justify는 W가 바뀔 때 해당 줄의 advance만 다시 만든다). 변화 없는 UpdateLayout + Render는 할당 0(기존 테스트 유지).
      기존 테스트 변경(요구사항 변경): TextBlockTests의 `"A\r\nB"` 케이스는 CR·LF를 measurer에 넘기지 않고 두 줄이 되는 새 동작을 검증하도록 바꾼다.
      다른 기존 기대값은 바꾸지 마라.
      만들지 마라: TextTrimming, LineHeight·LineStackingStrategy 프로퍼티, Inlines, FontFamily, 폰트 폴백, 커닝. 이유: PRD 범위 밖이거나 이후 계획이다.

      테스트 dotnet/Xamlity.Core.Tests/Rendering/TextWrappingTests.cs (FakeTextMeasurer 재사용, FontSize 10 → 글자 5px, LineHeight 12, Ascent 8):
      - "AB CD EF", Width=30, Wrap → 줄 "AB CD"(폭 25)와 "EF"(10), 기준선 y 8과 20, DesiredSize 높이 24. Center → x 2.5와 10, Right → 5와 20,
        Justify → 첫 줄 공백 advance 10, 둘째 줄 x 0.
      - "ABCDEFGH", Width=30: Wrap → "ABCDEF"/"GH", WrapWithOverflow → 폭 40인 한 줄, NoWrap → 한 줄. "AB CDEFGHIJ", Width=30, Wrap → "AB"/"CDEFGH"/"IJ".
      - NoWrap에서 "AB\nCD", "AB\r\nCD" → 두 줄, "AB\n\nCD" → 세 줄(높이 36). 한글 "가나 다라 마바", Width=25, Wrap → "가나 다라"/"마바".
      - 측정 폭과 배치 폭이 다른 테스트 전용 부모에서 배치 폭으로 다시 나뉨. 무한 폭 제약에서는 나뉘지 않음.
      - Border에 설정한 TextAlignment가 자식 TextBlock에 상속됨. 같은 값 재설정은 GlyphRun을 다시 만들지 않음. 변화 없는 UpdateLayout + Render 할당 0.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Controls/TextBlock.cs
      - unity/Packages/com.loonacia.xamlity/Core/Controls/TextWrapping.cs*
      - unity/Packages/com.loonacia.xamlity/Core/Controls/TextAlignment.cs*
      - dotnet/Xamlity.Core.Tests/Rendering/TextWrappingTests.cs
      - dotnet/Xamlity.Core.Tests/Rendering/TextBlockTests.cs
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s6-rendering-opacity
    title: apply element Opacity through PushOpacity
    type: feat
    scope: rendering
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 4의 Opacity), docs/ARCHITECTURE.md (레이어 규칙의 메시 배치, 횡단 관심사 > 성능),
      unity/Packages/com.loonacia.xamlity/Core/Rendering/IDrawingContext.cs, Core/Tree/UIElement.cs (Render), UIRoot.cs (OffsetDrawingContext),
      Runtime/MeshDrawingContext.cs, Tests/Editor/RenderingTests.cs, dotnet/Xamlity.Core.Tests/Rendering/RecordingDrawingContext.cs,
      BorderRenderingTests.cs, TextBlockTests.cs (각각의 private EmptyDrawingContext).

      1. IDrawingContext에 WPF DrawingContext와 같은 이름으로 `void PushOpacity(double opacity)`, `void Pop()`을 추가한다. Pop은 가장 최근 Push를 되돌린다
         (s7의 PushClip도 같은 스택을 쓴다). UIRoot.OffsetDrawingContext는 그대로 전달한다.
      2. UIElement DP `Opacity` (double, 기본 1.0, AffectsRender). 렌더 순회에서 Opacity가 1보다 작으면 그 요소의 OnRender 전에 PushOpacity하고,
         자손까지 그린 뒤 Pop한다. Opacity가 0 이하이거나 NaN이면 그 요소와 자손의 명령을 하나도 내지 않는다. 1 이상이면 Push하지 않는다.
         Opacity 변경은 레이아웃을 무효화하지 않는다.
      3. MeshDrawingContext: 불투명도 스택(재사용 리스트). 현재 불투명도는 스택 값의 곱을 [0,1]로 고정한 값이다.
         정점 색 알파 = 브러시 알파 × 현재 불투명도(반올림한 바이트). Begin에서 스택을 비운다. 빈 스택에서 Pop하면 InvalidOperationException.
         셰이더는 바꾸지 마라. 이유: PRD가 Opacity를 "자식 알파에 곱함"으로 정했다(WPF의 그룹 불투명도와 달리 겹친 자식끼리 비쳐 보이는 것은 의도된 동작).
      4. 테스트 도우미: BorderRenderingTests·TextBlockTests의 private EmptyDrawingContext를 dotnet/Xamlity.Core.Tests/Rendering/EmptyDrawingContext.cs(internal)
         하나로 합친다. 이유: 이 계획에서 IDrawingContext가 여러 번 늘어나 매번 두 곳을 고치게 된다. RecordingDrawingContext에는 모든 호출을 순서대로 담는
         목록을 추가한다(기존 Rectangles/GlyphRuns는 그대로 두고 기존 테스트를 바꾸지 않는다).
      만들지 마라: PushClip(s7), OpacityMask, 그룹 불투명도(오프스크린 렌더). 이유: s7이거나 PRD 범위 밖이다.

      테스트:
      - Core dotnet/Xamlity.Core.Tests/Rendering/OpacityTests.cs: PushOpacity → 그리기 → Pop 순서와 값, 중첩, Opacity 0이면 자손 명령 없음, 1이면 Push 없음,
        Opacity 변경은 render dirty를 만들고 measure/arrange는 유효함, 변화 없는 Render 할당 0.
      - Unity RenderingTests.cs: MeshDrawingContext 단위 — PushOpacity(0.5) 안 알파 255 사각형 → 128, 중첩 0.5×0.5 → 64, Pop 뒤 원래 알파, 빈 스택 Pop 예외.
        픽셀 — TopBand 루트의 Border에 코드로 Opacity 0.5를 주고 렌더하면 띠 안 R이 약 188/255(±3)이고 G·B는 0.
        188인 이유: 셰이더가 linear 공간에서 블렌딩하므로 linear 0.5가 sRGB 타깃에 인코딩된다. WPF의 sRGB 공간 블렌딩(128)과 다른 것은 알려진 차이이며
        이 스텝에서 고치지 않는다. 기존 픽셀 테스트는 기대값을 바꾸지 않고 통과해야 한다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Rendering/IDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIElement.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIRoot.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/RenderingTests.cs
      - dotnet/Xamlity.Core.Tests/Rendering/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s7-rendering-clip
    title: clip elements to their bounds and layout slots
    type: feat
    scope: rendering
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 4의 사각형 클립), unity/Packages/com.loonacia.xamlity/Core/Tree/UIElement.cs, FrameworkElement.cs
      (ArrangeCore는 WPF FrameworkElement.ArrangeCore를 옮긴 코드다), UIRoot.cs, Core/Layout/Canvas.cs, Core/Rendering/IDrawingContext.cs (s6),
      Runtime/MeshDrawingContext.cs (s6의 스택), Tests/Editor/RenderingTests.cs, dotnet/Xamlity.Core.Tests/Rendering/RecordingDrawingContext.cs, EmptyDrawingContext.cs.

      1. IDrawingContext `void PushClip(Rect clipRect)` (호출자 좌표계의 축 정렬 사각형, WPF PushClip에 해당). Pop은 s6과 같은 스택이다.
         OffsetDrawingContext는 절대 좌표로 옮겨 전달한다.
      2. UIElement DP `ClipToBounds` (bool, false, AffectsRender). `protected virtual Rect? GetLayoutClip(Size layoutSlotSize)` — 기본 구현은
         ClipToBounds면 (0,0,RenderSize), 아니면 null. layoutSlotSize는 마지막 Arrange의 finalRect 크기다.
      3. FrameworkElement: WPF ArrangeCore처럼 NeedsClipBounds를 계산해 둔다. 다음 중 하나면 true: 배치 크기를 unclippedDesiredSize까지 키운 경우,
         Max 제약으로 배치 크기를 줄인 경우, Max로 자른 ink 크기가 RenderSize보다 작은 경우, 클라이언트 크기(슬롯 − Margin)가 ink 크기보다 작은 경우.
         GetLayoutClip 오버라이드는 WPF FrameworkElement.GetLayoutClip과 같다(LayoutTransform 부분 제외):
         - NeedsClipBounds도 ClipToBounds도 아니면 null.
         - maxWidthClip = Width를 반영한 최대 폭이 무한대면 RenderSize.Width, 아니면 그 값(높이도 같음).
           needToClipLocally = ClipToBounds || maxWidthClip < RenderSize.Width || maxHeightClip < RenderSize.Height.
         - inkSize = RenderSize를 최대 폭·높이로 자른 크기. clippingSize = (max(0, 슬롯 폭 − Margin 가로 합), 높이도 같음).
           needToClipSlot = clippingSize가 어느 방향이든 inkSize보다 작음.
         - needToClipSlot이면 (−offset.X, −offset.Y, clippingSize). offset은 ArrangeCore와 같은 정렬 규칙(Stretch이고 ink가 더 크면 Left/Top)으로
           clippingSize 안에 inkSize를 둘 때의 오프셋이다. needToClipLocally면 (0,0,maxWidthClip,maxHeightClip)과 교집합.
           needToClipSlot이 아니고 needToClipLocally면 (0,0,maxWidthClip,maxHeightClip).
         Canvas는 WPF처럼 GetLayoutClip을 오버라이드해 ClipToBounds일 때만 (0,0,RenderSize), 아니면 null.
      4. 렌더 순회: 클립이 있으면 OnRender 전에 PushClip(요소 로컬 좌표), Opacity Push는 그 안쪽(WPF Visual의 clip → opacity 순서).
         자손까지 그린 뒤 넣은 순서의 반대로 Pop.
      5. MeshDrawingContext: 클립 스택(현재 클립 = 스택 사각형의 교집합). 쿼드를 CPU에서 현재 클립으로 자르고, 자른 비율만큼 UV를 선형 보간한다(글리프 쿼드 포함).
         완전히 밖인 쿼드는 정점과 배치를 만들지 않는다. 셰이더·머티리얼은 바꾸지 마라. 이유: RenderTransform이 PRD 범위 밖이라 모든 클립이 축 정렬
         사각형이므로 CPU로 정확히 자를 수 있고, 배치가 끊기지 않는다.
      만들지 마라: UIElement.Clip(Geometry), 스텐실·scissor 클립, UseLayoutRounding. 이유: PRD 범위 밖이다.

      테스트:
      - Core dotnet/Xamlity.Core.Tests/Rendering/ClipTests.cs: ClipToBounds 사각형; Width=50인 NoWrap TextBlock(텍스트 폭 120, FontSize 12)의 로컬 클립
        (0,0,50,14.4); 높이 20인 Width 100 Border 안의 Width 200·Height 20 자식 — Left 정렬이면 (0,0,100,20), Center 정렬이면 (50,0,100,20);
        Canvas 안에서 넘치는 자식은 클립 없음, Canvas.ClipToBounds면 클립; 클립이 필요 없는 일반 배치는 PushClip이 없어 기존 명령 순서가 그대로임;
        Clip/Opacity Push·Pop 순서와 중첩; 변화 없는 Render 할당 0.
      - Unity RenderingTests.cs: MeshDrawingContext 단위 — 부분 클립된 사각형의 정점, 글리프 쿼드 UV 비례 보간, 완전히 밖이면 정점 0, 중첩 교집합과 Pop 복원.
        픽셀 — 왼쪽 위 ClipToBounds Border(Width 64) 안 Width 128 빨간 자식: x < 64 빨강, x ≥ 64 검정. 기존 픽셀 테스트는 기대값 그대로 통과.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Rendering/IDrawingContext.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIElement.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/FrameworkElement.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIRoot.cs
