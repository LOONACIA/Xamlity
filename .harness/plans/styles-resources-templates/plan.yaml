  - id: s11-markup-merged-dictionary-source
    title: merge resource dictionaries from other XAML files with Source
    type: feat
    scope: markup
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-003의 의존성 규칙, ADR-011의 OnImportAsset 금지 사항), docs/ARCHITECTURE.md (데이터 흐름 > 에디터: 임포트),
      unity/Packages/com.loonacia.xamlity/Core/Markup/*.cs (XamlAssetReference, IXamlAssetResolver, 이미지 경로 처리), Core/Styling/ResourceDictionary.cs,
      Editor/XamlImporter.cs (TryResolveImagePath, 이미지 의존성), Runtime/XamlAsset.cs (AssetResolver, s10의 사전 빌드), Tests/Editor/XamlImporterTests.cs (임시 폴더·재임포트 테스트).

      1. Core:
         - `ResourceDictionary.Source` (WPF와 같은 이름, `public Uri Source { get; }`, setter는 internal). 이유: 런타임 코드에는 에셋 해석기가 없어 코드에서 설정하면 불러올 수 없으므로 설정 자체를 막는다.
         - XAML의 ResourceDictionary 요소(어느 위치든)에 `Source="경로"`를 쓰면 그 XAML 에셋 사전의 내용(항목과 MergedDictionaries)을 가진다.
           Source와 자식 항목을 함께 쓰면 `A ResourceDictionary with Source cannot have entries.` 빈 경로는 오류. 경로 문법은 이미지와 같고 엔진 규칙은 임포터가 검사한다.
         - 파서는 이미지와 구분되는 에셋 참조로 기록한다(XamlAssetReference에 종류를 더하거나 별도 목록, 방식 자유).
         - `IXamlAssetResolver`에 `ResourceDictionary ResolveResourceDictionary(string value)`를 더한다. 빌더는 Source 노드에서 이것을 부르고 null이면 그 노드 위치의 XamlBuildException이다.
      2. Editor/XamlImporter: 사전 참조마다 이미지와 같은 경로 해석을 한다. 대상이 `.xaml`이 아니거나 없으면 `파일(줄,열): Resource dictionary '<값>': <이유>` 임포트 오류.
         소스 파일이 있으면 `ctx.DependsOnArtifact(path)`, 없으면 `ctx.DependsOnSourceAsset(path)`. 대상 XamlAsset이 HasIr이 아니면(임포트 오류) 오류, IR 루트가 ResourceDictionary가 아니면 오류.
         참조 테이블에 대상 XamlAsset을 넣는다. OnImportAsset 안에서 ImportAsset·Refresh를 부르지 마라(ADR-011).
      3. Runtime/XamlAsset 해석기: 참조 테이블의 XamlAsset을 원래 빌드와 같은 앱·테마 대체 사전으로 빌드해 돌려준다.
         순환(A → B → A)은 빌드 중인 에셋 스택으로 감지해 `Resource dictionary '<값>' is part of a reference cycle.` (XamlBuildException으로 줄·열 포함)로 끝낸다. 스택 오버플로가 나면 안 된다.
      4. docs/ARCHITECTURE.md 데이터 흐름 > 에디터: 임포트의 "다른 XAML(MergedDictionaries 등)은 소스 의존성 등록" 줄을 실제 규칙으로 고친다.
      만들지 마라: 사전 캐시, 패키지 밖 경로(pack URI), Source를 코드에서 설정하는 경로.

      테스트:
      - Core (dotnet/Xamlity.Core.Tests/Markup/ResourceMarkupTests.cs에 추가): Source 파싱·IR·참조 종류, 가짜 해석기로 병합 결과 조회, Source와 항목 동시 사용 오류, 해석기 null → XamlBuildException.
      - Unity (Tests/Editor/MergedDictionaryImportTests.cs, Assets/XamlityTestTemp/): A.xaml이 MergedDictionaries로 B.xaml을 Source 참조 → HasIr, 빌드 뒤 B의 브러시를 StaticResource로 사용.
        B의 브러시를 바꿔 저장하면 A를 다시 빌드할 때 새 값, B를 오류 XAML로 바꾸면 A가 재임포트되어 줄·열 오류. 없는 파일·비 XAML·ResourceDictionary가 아닌 루트도 줄·열 임포트 오류.
        같은 Refresh에서 만든 두 파일(참조하는 쪽 이름이 알파벳순으로 앞)도 결국 정상 임포트. 순환 참조 예외.
        자동 재임포트나 임포트 순서 문제가 해결되지 않으면 테스트를 약화하지 말고 blockers에 적는다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup/*
      - unity/Packages/com.loonacia.xamlity/Core/Styling/ResourceDictionary.cs
      - unity/Packages/com.loonacia.xamlity/Editor/XamlImporter.cs
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlAsset.cs
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/MergedDictionaryImportTests.cs*
      - dotnet/Xamlity.Core.Tests/Markup/*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

