  - id: s10-unity-theme-app-resources
    title: load the package theme and application resources in XamlityRoot
    type: feat
    scope: unity
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 6, 12), docs/ADR.md (ADR-003, ADR-013), docs/ARCHITECTURE.md (레이어 규칙, 데이터 흐름, 횡단 관심사 > 설정),
      unity/Packages/com.loonacia.xamlity/Runtime/XamlityRoot.cs·XamlAsset.cs·XamlitySettings.cs, Themes/Resources/Xamlity/Generic.xaml (s8),
      Core/Tree/UIRoot.cs·Core/Markup/XamlBuilder.cs (s5 오버로드), Tests/Editor/RenderingTests.cs·BindingRuntimeTests.cs (루트 도우미, 메모리 XamlAsset), Tests/Editor/SampleSetupTests.cs.

      1. XamlAsset: 루트가 ResourceDictionary인 에셋을 빌드하는 internal 경로(예: `internal ResourceDictionary BuildResourceDictionary(ResourceDictionary themeResources)`)와
         UIElement 빌드에 앱·테마 사전을 넘기는 오버로드를 더한다. 루트 타입이 기대와 다르면 InvalidOperationException `XAML asset '<이름>' must have a <UIElement|ResourceDictionary> root.`
         기존 공개 `Build()`의 동작은 유지한다.
      2. 테마: `Resources.Load<XamlAsset>("Xamlity/Generic")`로 읽는다. 없거나 임포트 오류면 경고 한 번(`Xamlity default theme is missing or has import errors.`)을 남기고 테마 없이 동작한다.
      3. XamlitySettings: `[SerializeField] private XamlAsset applicationResources;`, `public XamlAsset ApplicationResources => applicationResources;`.
         Project Settings UI를 만들지 마라. 이유: PRD 12의 설정 UI는 별도 계획이며 지금은 Inspector로 지정한다.
      4. XamlityRoot.Build: 테마 사전 → 앱 사전(테마를 대체 사전으로) → 뷰(앱·테마) 순으로 빌드하고 UIRoot에 앱·테마 사전을 넘긴다.
         테스트가 앱 리소스를 넘길 수 있게 `internal void Build(XamlAsset asset, TMP_FontAsset defaultFont = null, XamlAsset applicationResources = null)` 형태로 하고 Awake는 설정 값을 넘긴다.
         사전은 Build마다 새로 만든다. 캐시를 만들지 마라. 이유: 단순함 우선, 재사용은 핫리로드 계획에서 다룬다.
      5. docs/ARCHITECTURE.md: 데이터 흐름 > 런타임: 생성에 테마·앱 사전 빌드 순서를, 횡단 관심사 > 설정에 applicationResources 필드를 적는다.
      만들지 마라: MergedDictionaries Source(s11), 샘플(s12), 설정 UI, 사전 캐시.

      테스트 Tests/Editor/ThemeResourcesTests.cs (메모리 XamlAsset 또는 기존 테스트처럼 Assets/XamlityTestTemp/ 임시 폴더):
      - `Resources.Load<XamlAsset>("Xamlity/Generic")`가 HasIr이고 빌드한 사전에 ContentControl·UserControl 스타일이 있음.
