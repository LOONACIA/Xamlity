id: first-vertical-slice
goal: >
  Xamlity의 첫 수직 슬라이스를 만든다. UPM 패키지(unity/Packages/com.loonacia.xamlity)와
  dotnet 프로젝트 골격을 세우고, Core에 경량 DependencyProperty, Measure/Arrange 레이아웃(StackPanel),
  Border·TextBlock 그리기 명령, XAML 파서 → IR → 요소 트리 빌더를 만든다. Unity 쪽에는 .xaml을 XamlAsset으로
  바꾸는 ScriptedImporter, TMP_FontAsset 기반 글자 측정, URP RendererFeature로 back buffer에 직접 그리는
  렌더러를 만든다. 샘플 씬에서 XAML로 선언한 Border와 한글 TextBlock이 화면에 보이면 완료다.
  Grid/Canvas, 프로퍼티 요소·첨부 프로퍼티 문법, 스타일·템플릿, 바인딩, 입력, Image, CornerRadius, 클립·Opacity,
  TextWrapping, 기준 해상도 배율, 코드비하인드, 핫리로드는 이 계획에 넣지 않는다(다음 계획).
  공통 규칙: 코드 식별자, 주석, 예외·오류 메시지는 영어로 쓴다. Core 코드는 netstandard2.1 API와 C# 9 문법만 쓴다.
  모든 스텝은 dotnet test와 unity test를 둘 다 통과해야 한다. unity test 실행 중 Unity가 새 파일의 .meta를 만들며,
  이 .meta 파일은 커밋 대상이므로 지우지 않는다.
approved: true
max_attempts: 3
ac_timeout_sec: 1200
steps:
  - id: s1-scaffold
    title: scaffold UPM package, dotnet projects, and test runners
    type: chore
    scope: repo
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md (디렉토리 구조, 레이어 규칙, 횡단 관심사 > 테스트), docs/ADR.md (ADR-002, ADR-013),
      unity/Packages/manifest.json.

      unity/ Unity 프로젝트(6000.5.4f1, URP 17.5.0)는 이미 있다. 이 스텝은 패키지와 dotnet 프로젝트 골격을 만들고,
      두 테스트 러너에서 실제 테스트가 하나 이상 돌게 한다.

      1. UPM 패키지 unity/Packages/com.loonacia.xamlity/ (embedded 패키지라 manifest dependencies에 넣지 않아도 인식된다):
         - package.json: name `com.loonacia.xamlity`, displayName `Xamlity`, version `0.1.0`, unity `6000.5`,
           dependencies `com.unity.render-pipelines.universal: 17.5.0`, `com.unity.ugui: 2.5.0` (manifest.json과 같은 버전).
         - Core/Xamlity.Core.asmdef: name `Xamlity.Core`, rootNamespace `Xamlity`, `noEngineReferences: true`, references 없음.
         - Core/AssemblyInfo.cs: `[assembly: InternalsVisibleTo("Xamlity.Core.Tests")]`, `[assembly: InternalsVisibleTo("Xamlity.Editor.Tests")]`.
         - Runtime/Xamlity.Unity.asmdef: name `Xamlity.Unity`, rootNamespace `Xamlity.Unity`, references `Xamlity.Core`,
           `Unity.RenderPipelines.Core.Runtime`, `Unity.RenderPipelines.Universal.Runtime`, `Unity.TextMeshPro`.
         - Runtime/AssemblyInfo.cs: InternalsVisibleTo `Xamlity.Editor`, `Xamlity.Editor.Tests`.
         - Editor/Xamlity.Editor.asmdef: name `Xamlity.Editor`, rootNamespace `Xamlity.Editor`, includePlatforms `["Editor"]`,
           references `Xamlity.Core`, `Xamlity.Unity`. Editor/AssemblyInfo.cs: InternalsVisibleTo `Xamlity.Editor.Tests`.
         - Tests/Editor/Xamlity.Editor.Tests.asmdef: includePlatforms `["Editor"]`, `defineConstraints: ["UNITY_INCLUDE_TESTS"]`,
           `overrideReferences: true`, `precompiledReferences: ["nunit.framework.dll"]`, references `Xamlity.Core`, `Xamlity.Unity`,
           `Xamlity.Editor`, `UnityEngine.TestRunner`, `UnityEditor.TestRunner`.
      2. dotnet/Xamlity.Core/Xamlity.Core.csproj: `TargetFramework netstandard2.1`, `LangVersion 9`, `AssemblyName Xamlity.Core`,
         `RootNamespace Xamlity`, `EnableDefaultCompileItems false`, `<Compile Include="../../unity/Packages/com.loonacia.xamlity/Core/**/*.cs" />`.
         Nullable은 켜지 않는다. Core 소스를 dotnet/ 아래로 복사하지 마라. 이유: ADR-002, 소스는 패키지 한 곳에만 둔다.
      3. dotnet/Xamlity.Core.Tests/Xamlity.Core.Tests.csproj: `net10.0`, Xamlity.Core ProjectReference,
         패키지 `Microsoft.NET.Test.Sdk 17.12.0`, `NUnit 3.14.0`, `NUnit3TestAdapter 4.6.0` (정확히 이 버전. 로컬 NuGet 캐시에 이미 있어
         네트워크 없이 restore된다). NUnit 4를 쓰지 마라. 이유: Unity Test Framework가 NUnit 3 계열이라 같은 `Assert.That` 습관을 유지한다.
      4. 첫 Core 코드: Core/Layout/에 WPF와 같은 의미의 기하 구조체 `Size`, `Point`, `Rect`, `Thickness` (namespace `Xamlity.Layout`).
         모두 `readonly struct`, `IEquatable<T>`, `==`/`!=`, InvariantCulture `ToString()`.
         - `Size(double width, double height)`: 음수 width/height는 `ArgumentException` (WPF와 같음). 무한대는 허용.
         - `Point(double x, double y)`.
         - `Rect(double x, double y, double width, double height)`, `Rect(Point location, Size size)`; `X, Y, Width, Height, Left, Top,
           Right, Bottom, Location, Size`. 음수 크기는 `ArgumentException`.
         - `Thickness(double uniformLength)`, `Thickness(double left, double top, double right, double bottom)`; `Left, Top, Right, Bottom`.
         `Size.Empty`, `Rect.Empty`, 연산 메서드(Union, Intersect 등)는 만들지 마라. 이유: 아직 쓰는 곳이 없다.
         테스트: dotnet/Xamlity.Core.Tests/Layout/GeometryTests.cs.
      5. Unity 테스트 Tests/Editor/CoreAssemblyTests.cs: `typeof(Xamlity.Layout.Thickness).Assembly`의 이름이 `Xamlity.Core`이고,
         `GetReferencedAssemblies()`에 이름이 `UnityEngine`, `UnityEditor`, `Unity.`으로 시작하는 어셈블리가 없음을 검증한다.
      6. docs/ADR.md의 ADR-013 "하네스에 미치는 영향"에서 `--output`을 `unity/Temp/` 아래로 지정하라는 문장을 `unity/Logs/` 아래로 고치고
         이유를 붙인다: 에디터가 종료할 때 Temp/를 지워 결과 파일이 남지 않는다(실제로 확인됨).

      검증: `unity test`가 끝난 뒤 unity/Logs/editmode-results.xml에서 total이 1 이상인지 확인하라. 테스트가 0개여도 명령은 0으로 끝난다.
      패키지 테스트가 실행되지 않으면 unity/Packages/manifest.json에 `"testables": ["com.loonacia.xamlity"]`를 추가한다.
      Unity가 unity/Packages/packages-lock.json에 embedded 패키지를 기록하는 것은 정상이다.
      ADR-013에 따라 `unity test`가 Codex 환경에서 실행되지 않으면 우회하지 말고 blockers에 적는다.
      끝난 뒤 Unity 에디터 프로세스가 남아 있지 않은지 확인한다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/*
      - unity/Packages/manifest.json
      - unity/Packages/packages-lock.json
      - dotnet/Xamlity.Core/*
      - dotnet/Xamlity.Core.Tests/*
      - docs/ADR.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s2-core-properties
    title: add lightweight DependencyProperty system with inheritance
    type: feat
    scope: core
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-005), docs/ARCHITECTURE.md (Core 영역 표의 `Properties`), unity/Packages/com.loonacia.xamlity/Core/Layout/*.cs
      (스텝 s1의 코드 스타일).

      unity/Packages/com.loonacia.xamlity/Core/Properties/에 namespace `Xamlity.Properties`로 만든다:
      - `public delegate void PropertyChangedCallback(DependencyObject d, DependencyPropertyChangedEventArgs e);`
      - `public readonly struct DependencyPropertyChangedEventArgs` { `DependencyProperty Property`, `object OldValue`, `object NewValue` }.
      - `public class PropertyMetadata` { ctor `(object defaultValue)`, `(object defaultValue, PropertyChangedCallback propertyChangedCallback)`;
        `DefaultValue`, `PropertyChangedCallback` }.
      - `[Flags] public enum FrameworkPropertyMetadataOptions { None = 0, AffectsMeasure = 1, AffectsArrange = 2, AffectsRender = 4, Inherits = 8 }`
        (WPF 값과 이름이 다를 수 있지만 위 다섯 개만 둔다).
      - `public class FrameworkPropertyMetadata : PropertyMetadata` { ctor `(object defaultValue, FrameworkPropertyMetadataOptions flags,
        PropertyChangedCallback propertyChangedCallback = null)`; bool `AffectsMeasure`, `AffectsArrange`, `AffectsRender`, `Inherits` }.
      - `public sealed class DependencyProperty` { `static DependencyProperty Register(string name, Type propertyType, Type ownerType,
        PropertyMetadata typeMetadata = null)`; `Name`, `PropertyType`, `OwnerType`, `DefaultMetadata`; `public static readonly object UnsetValue`;
        `internal static DependencyProperty FromName(Type ownerType, string name)` (ownerType에서 기반 타입 쪽으로 찾고, 없으면 null) }.
        같은 (ownerType, name)을 두 번 등록하면 `ArgumentException`. metadata가 null이면 값 타입은 `default`, 참조 타입은 null을 기본값으로 쓴다.
        기본값 타입이 PropertyType에 맞지 않으면 등록 시 `ArgumentException`.
      - `public class DependencyObject` {
          `object GetValue(DependencyProperty dp)`, `void SetValue(DependencyProperty dp, object value)`, `void ClearValue(DependencyProperty dp)`,
          `object ReadLocalValue(DependencyProperty dp)` (로컬 값이 없으면 `DependencyProperty.UnsetValue`),
          `protected virtual void OnPropertyChanged(DependencyPropertyChangedEventArgs e)`,
          `protected internal virtual DependencyObject InheritanceParent => null;`,
          `protected internal virtual int InheritanceChildrenCount => 0;`,
          `protected internal virtual DependencyObject GetInheritanceChild(int index)` (기본 구현은 ArgumentOutOfRangeException),
          `protected internal void OnInheritanceParentChanged(DependencyObject oldParent)` }.
      굽히면 안 되는 규칙:
      - 값 우선순위는 로컬 값 → 상속값 → 기본값 세 단계만 구현한다. 스타일·템플릿·트리거 단계는 만들지 마라. 이유: 다음 계획의 Styling에서
        ADR-005 순서대로 끼워 넣는다.
      - SetValue 값이 PropertyType에 할당 불가능하면(참조 타입은 null 허용, 값 타입은 null 불가) `ArgumentException`.
      - 유효값이 실제로 바뀔 때만(`object.Equals`로 비교) 메타데이터의 PropertyChangedCallback과 OnPropertyChanged를 부른다. 순서는 WPF처럼
        OnPropertyChanged가 먼저 불리고 그 안에서 callback이 불리는 구조여도, callback 먼저여도 되지만 테스트로 고정한다.
      - Inherits 프로퍼티: 로컬 값이 없으면 InheritanceParent 체인을 따라 올라가 유효값을 찾고, 끝까지 없으면 기본값이다. 상속값은 캐시하지 않아도 된다.
        단, 어떤 객체의 Inherits 프로퍼티 유효값이 바뀌면 그 프로퍼티에 로컬 값이 없는 자손 전체(InheritanceChildrenCount/GetInheritanceChild로 순회)에
        변경 알림이 가야 한다. 소유 타입과 무관하게 모든 DependencyObject를 통해 상속된다(WPF처럼 Border를 거쳐 TextBlock으로 FontSize가 내려간다).
      - OnInheritanceParentChanged(oldParent): 등록된 모든 Inherits 프로퍼티에 대해 oldParent 기준 값과 새 부모 기준 값을 비교해 바뀐 것만 알린다
        (자손까지 전파).
      - GetValue는 GC 할당이 없어야 한다(저장된 boxed 값을 그대로 반환).
      - 메인 스레드 전용이다. lock을 넣지 마라.
      만들지 마라: coercion, validation callback, Freezable, RegisterAttached, OverrideMetadata, AddOwner, 읽기 전용 프로퍼티. 이유: ADR-005가
      coercion/validation/Freezable을 제외했고, 첨부 프로퍼티는 Grid와 함께 다음 계획에서 추가한다.

      테스트 dotnet/Xamlity.Core.Tests/Properties/DependencyPropertyTests.cs: 테스트 전용 DependencyObject 서브클래스(부모·자식을 갖는 노드)로
      기본값, 로컬 값, ClearValue, ReadLocalValue, 타입 불일치 예외, 중복 등록 예외, FromName의 기반 타입 탐색, 변경 알림의 old/new 값과
      같은 값 재설정 시 알림 없음, 상속, 자식 로컬 값의 상속 차단, 조부모 값 변경이 손자에게 알림, 재부모화 시 OnInheritanceParentChanged 알림을 검증한다.
      DependencyProperty 레지스트리는 정적이므로 테스트마다 다른 이름이나 다른 owner 타입을 써서 중복 등록 충돌을 피한다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Properties*
      - dotnet/Xamlity.Core.Tests/Properties/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s3-core-element-layout
    title: add UIElement and FrameworkElement Measure/Arrange with invalidation
    type: feat
    scope: core
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-005, ADR-007), docs/ARCHITECTURE.md (Core 영역 표, 횡단 관심사 > 성능),
      unity/Packages/com.loonacia.xamlity/Core/Properties/*.cs, Core/Layout/*.cs.

      WPF FrameworkElement의 레이아웃 규칙을 그대로 구현한다. 모든 레이아웃 관련 값은 등록된 DependencyProperty로 만든다(ADR-005).
      1. Core/Layout/HorizontalAlignment.cs, VerticalAlignment.cs (namespace `Xamlity.Layout`): WPF와 같은 멤버 `Left, Center, Right, Stretch` /
         `Top, Center, Bottom, Stretch`.
      2. Core/Tree/UIElement.cs (namespace `Xamlity.Tree`), `public abstract class UIElement : DependencyObject`:
         - `Size DesiredSize`, `Size RenderSize`, `Point VisualOffset` (비주얼 부모 기준 위치), `bool IsMeasureValid`, `bool IsArrangeValid`.
         - `void Measure(Size availableSize)`, `void Arrange(Rect finalRect)`, `protected virtual Size MeasureCore(Size availableSize)`,
           `protected virtual void ArrangeCore(Rect finalRect)`, `void InvalidateMeasure()`, `void InvalidateArrange()`.
         - `UIElement VisualParent`, `protected void AddVisualChild(UIElement child)`, `protected void RemoveVisualChild(UIElement child)`,
           `protected virtual int VisualChildrenCount`, `protected virtual UIElement GetVisualChild(int index)`.
           Add/RemoveVisualChild는 부모를 설정·해제하고 `OnInheritanceParentChanged`를 부른다. 이미 부모가 있는 요소를 추가하면 InvalidOperationException.
         - InheritanceParent/InheritanceChildren은 비주얼 부모·자식으로 오버라이드한다(논리 트리는 템플릿과 함께 다음 계획에서 도입).
         - OnPropertyChanged: 메타데이터가 FrameworkPropertyMetadata이고 AffectsMeasure면 InvalidateMeasure, AffectsArrange면 InvalidateArrange.
         무효화 규칙(단순화한 WPF): InvalidateMeasure는 자신과 모든 조상을 measure/arrange 무효로 표시한다. InvalidateArrange는 자신과 조상을 arrange
         무효로 표시한다. Measure는 measure가 유효하고 availableSize가 직전과 같으면 아무것도 하지 않는다. Arrange는 arrange가 유효하고 finalRect가
         직전과 같으면 아무것도 하지 않는다. 그래서 형제 요소는 다시 측정되지 않는다.
      3. Core/Tree/FrameworkElement.cs, `public class FrameworkElement : UIElement`:
         DP `Width`, `Height` (기본 NaN), `MinWidth`, `MinHeight` (0), `MaxWidth`, `MaxHeight` (+∞), `Margin` (Thickness 0),
         `HorizontalAlignment`, `VerticalAlignment` (Stretch) — 모두 AffectsMeasure(alignment는 AffectsArrange), `Name` (string, 빈 문자열, 레이아웃 영향 없음).
         `protected virtual Size MeasureOverride(Size availableSize)` (기본: 자식 없이 0,0), `protected virtual Size ArrangeOverride(Size finalSize)` (기본: finalSize).
         MeasureCore/ArrangeCore는 WPF FrameworkElement 규칙대로: Margin 제외, Width/Height/Min/Max로 제약, MeasureOverride 결과 클램프,
         Arrange에서 Stretch가 아니면 desired 크기를 쓰고 alignment로 위치를 정하며 Margin만큼 안쪽으로 배치. 결과는 VisualOffset과 RenderSize로 남긴다.
         레이아웃 반올림(UseLayoutRounding)과 클립은 하지 않는다. 이유: v1 범위 밖이며 클립은 다음 계획의 렌더링 스텝에서 다룬다.
      4. Core/Tree/UIRoot.cs, `public sealed class UIRoot`: ctor `(UIElement rootElement)`, `RootElement`, `void UpdateLayout(Size viewportSize)`
         (루트를 viewport로 Measure한 뒤 `Rect(0,0,viewport)`로 Arrange). 변화가 없으면 두 번째 호출은 MeasureOverride/ArrangeOverride를 부르지 않는다.
      만들지 마라: Panel/StackPanel(다음 스텝 s4), 그리기와 OnRender(s5), NameScope/FindName, 논리 트리, 이벤트. 이유: 각각 이후 스텝·계획에서 추가한다.

      테스트 dotnet/Xamlity.Core.Tests/Tree/LayoutTests.cs: 테스트 전용 FrameworkElement(고정된 콘텐츠 크기, MeasureOverride/ArrangeOverride 호출 횟수 기록)와
      자식을 겹쳐 배치하는 테스트 전용 컨테이너로 WPF 기대 좌표를 검증한다. 예: 400x300 viewport에서 Width=100 Height=50 Center/Center → VisualOffset (150,125),
      RenderSize 100x50. Margin=10 Stretch → (10,10) 380x280. Right/Bottom 정렬, MinWidth/MaxWidth 클램프, NaN Width가 콘텐츠 크기를 쓰는 경우.
      무효화: 변화 없는 두 번째 UpdateLayout은 호출 횟수가 늘지 않고, 한 자식의 Width를 바꾸면 그 자식과 조상만 다시 측정되고 형제는 그대로다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Tree*
      - unity/Packages/com.loonacia.xamlity/Core/Layout/HorizontalAlignment.cs*
      - unity/Packages/com.loonacia.xamlity/Core/Layout/VerticalAlignment.cs*
      - dotnet/Xamlity.Core.Tests/Tree/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s4-core-stackpanel
    title: add Panel, UIElementCollection, and StackPanel
    type: feat
    scope: core
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-004, ADR-007), unity/Packages/com.loonacia.xamlity/Core/Tree/*.cs (s3의 UIElement·FrameworkElement 무효화 규칙),
      dotnet/Xamlity.Core.Tests/Tree/LayoutTests.cs (테스트 스타일).

      namespace `Xamlity.Layout`에 WPF와 같은 의미로 만든다:
      - Core/Layout/Orientation.cs: `Horizontal, Vertical`.
      - Core/Layout/UIElementCollection.cs: `public sealed class UIElementCollection : IList<UIElement>` 수준의 API(`Add, Insert, Remove, RemoveAt, Clear,
        Count, this[int], Contains, IndexOf`, 열거). 소유 패널의 AddVisualChild/RemoveVisualChild를 호출하고 소유 패널을 InvalidateMeasure한다.
        null 추가는 ArgumentNullException. 인덱서로 교체하면 이전 요소를 제거하고 새 요소를 추가한다. foreach가 GC 할당을 하지 않도록 struct 열거자를
        public `GetEnumerator()`로 제공한다(인터페이스 열거자는 별도 구현).
      - Core/Layout/Panel.cs: `public abstract class Panel : FrameworkElement`, `UIElementCollection Children`, VisualChildrenCount/GetVisualChild를
        Children으로 오버라이드. (WPF의 System.Windows.Controls.Panel과 같은 추상 기반 클래스다.)
      - Core/Layout/StackPanel.cs: `public class StackPanel : Panel`, DP `Orientation` (기본 Vertical, AffectsMeasure).
        WPF 규칙: 쌓는 방향은 무한대로, 교차 방향은 사용 가능한 크기로 자식을 Measure한다. desired는 쌓는 방향 합, 교차 방향 최댓값.
        Arrange는 쌓는 방향으로 각 자식의 desired 크기만큼, 교차 방향은 finalSize 전체를 준다(자식 alignment가 그 안에서 적용됨).
