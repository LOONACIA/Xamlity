  - id: s13-sample-scene
    title: add XamlitySettings default font and Korean hello sample scene
    type: feat
    scope: sample
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 4, 12, 범위 밖의 폰트 항목), docs/ARCHITECTURE.md (횡단 관심사 > 설정),
      unity/Packages/com.loonacia.xamlity/Runtime/*.cs, unity/Assets/Scenes/SampleScene.unity, unity/ProjectSettings/EditorBuildSettings.asset.

      1. Runtime/XamlitySettings.cs: `public sealed class XamlitySettings : ScriptableObject`, `[SerializeField] TMP_FontAsset defaultFont` + 읽기 프로퍼티,
         `internal static XamlitySettings Load()` = `Resources.Load<XamlitySettings>("XamlitySettings")` (결과 캐시). XamlityRoot는 Awake에서 이 기본 폰트를 UIRoot에 넘긴다.
         설정이나 폰트가 없으면 `Debug.LogWarning`을 한 번 남기고 텍스트 없이 동작한다. Project Settings > Xamlity UI(SettingsProvider)와 App.xaml 지정은
         만들지 마라. 이유: 다음 계획의 화면 호스팅·설정 스텝에서 이 에셋 위에 UI를 얹는다.
      2. 샘플 에셋(unity/Assets/):
         - Fonts/NotoSansKR-Regular SDF.asset: Fonts/NotoSansKR-Regular.otf로 만든 동적(SDFAA) TMP 폰트 에셋. TMP API로 만들어야 하므로 일회성 batchmode
           스크립트(`unity run` + `-executeMethod`)를 써도 되며, 그 스크립트는 커밋하지 말고 지운다. 동적 글리프 데이터가 저장소에 쌓이지 않도록
           만든 직후의 빈 아틀라스 상태로 저장한다.
         - Resources/XamlitySettings.asset: defaultFont = 위 폰트 에셋.
         - Samples/Hello/Hello.xaml: StackPanel(가운데 정렬) 안에 Background·BorderBrush·BorderThickness·Padding이 있는 Border와, 그 안 TextBlock
           "안녕하세요, Xamlity!"(FontSize 32, Foreground White), 그 아래 영문 TextBlock 하나.
         - Scenes/SampleScene.unity: `XamlityRoot` GameObject를 추가하고 xaml = Hello.xaml.
      3. 테스트 Tests/Editor/SampleSetupTests.cs (개발 저장소 전용임을 주석 한 줄로): `XamlitySettings.Load()`가 null이 아니고 defaultFont가 동적 폰트이며
         sourceFontFile이 연결됨, Hello.xaml이 HasIr이고 Build()가 성공, SampleScene에 XamlityRoot가 있고 Hello.xaml을 참조함
         (씬은 `EditorSceneManager.OpenScene(..., OpenSceneMode.Additive)`로 열고 테스트 끝에 닫는다). 저장된 폰트 에셋에 글자를 추가하지 마라. 이유: 에셋이 바뀌어 git에 남는다.
      한글이 실제로 화면에 보이는지는 사람이 Play 모드에서 확인한다(PRD 기능 4의 수동 확인). summary에 확인 방법(씬 이름, 기대 화면)을 적는다.
    expected_files:
