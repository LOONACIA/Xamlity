  - id: s5-core-border-render
    title: render Border through IDrawingContext with render invalidation
    type: feat
    scope: core
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md (Core 영역 표의 `Rendering`, `Controls`, 레이어 규칙, 횡단 관심사 > 성능), docs/ADR.md (ADR-006),
      unity/Packages/com.loonacia.xamlity/Core/Tree/*.cs, Core/Layout/*.cs.

      1. namespace `Xamlity.Rendering` (Core/Rendering/):
         - `Color`: `readonly struct`, byte `A, R, G, B`, `static Color FromArgb(byte a, byte r, byte g, byte b)`, `FromRgb(byte r, byte g, byte b)`, IEquatable.
         - `public abstract class Brush`, `public sealed class SolidColorBrush : Brush` (ctor `(Color color)`, 읽기 전용 `Color`). 생성 후 바뀌지 않는다.
           `<SolidColorBrush Color=...>` 요소 문법을 위한 setter는 만들지 마라. 이유: 프로퍼티 요소 문법은 다음 계획에서 다룬다.
         - `public interface IDrawingContext { void DrawRectangle(Brush brush, Rect rect); }` — 이 스텝에서는 이 메서드 하나만 둔다.
           DrawGlyphRun은 s6에서 추가한다. 둥근 사각형, 이미지, PushClip/PushOpacity는 만들지 마라. 이유: 다음 계획의 렌더링 스텝 범위다.
      2. UIElement: `protected virtual void OnRender(IDrawingContext drawingContext)` (요소 로컬 좌표, 원점은 RenderSize 왼쪽 위), `void InvalidateVisual()`.
         AffectsRender 프로퍼티 변경과, Arrange 결과(VisualOffset/RenderSize)가 바뀌는 경우 소속 UIRoot를 render dirty로 만든다.
         요소가 소속 UIRoot를 찾는 방법: UIRoot가 루트 요소에 자신을 기록하고, 요소는 VisualParent를 따라 맨 위까지 올라가 그 값을 읽는다.
      3. UIRoot: `bool IsRenderDirty` (생성 직후 true), `void Render(IDrawingContext drawingContext)`: 비주얼 트리를 부모 → 자식(인덱스 순) 순서로 돌며
         각 요소의 OnRender를 루트 절대 좌표로 변환해 전달하고, 끝나면 IsRenderDirty를 false로 만든다. 좌표 변환은 재사용하는 내부 래퍼
         IDrawingContext 하나로 처리해 Render 호출당 GC 할당이 없게 한다.
      4. Core/Controls/Border.cs (namespace `Xamlity.Controls`), `public class Border : FrameworkElement`:
         DP `Background`, `BorderBrush` (Brush, null, AffectsRender), `BorderThickness`, `Padding` (Thickness, AffectsMeasure|AffectsRender).
         `UIElement Child` CLR 프로퍼티(WPF Decorator.Child와 같음: 교체 시 Remove/AddVisualChild, InvalidateMeasure).
         Measure: 자식에게 availableSize − BorderThickness − Padding을 주고 desired = 자식 desired + BorderThickness + Padding.
         Arrange: 자식을 안쪽 사각형에 배치. OnRender(WPF처럼 테두리 먼저, 배경 나중): BorderBrush가 있고 두께가 0보다 크면 네 변을
         위 (0,0,W,t), 아래 (0,H−b,W,b), 왼쪽 (0,t,l,H−t−b), 오른쪽 (W−r,t,r,H−t−b) 순서로 그리고(폭이나 높이가 0인 사각형은 생략),
         Background가 있으면 안쪽 사각형 (l,t,W−l−r,H−t−b)을 그린다. CornerRadius는 만들지 마라. 이유: 둥근 사각형 그리기는 다음 계획이다.

      테스트(dotnet/Xamlity.Core.Tests/Rendering/): 기록용 `RecordingDrawingContext`(테스트 프로젝트에만 둔다. 이유: ARCHITECTURE의 테스트 전략)로
      중첩 Border의 절대 좌표, 테두리 네 변 분해와 순서, null 브러시면 명령 없음, Padding·BorderThickness가 자식 위치에 반영됨을 검증한다.
      render dirty: Render 후 false, Background 변경 시 true, Width 변경으로 위치가 바뀌면 UpdateLayout 후 true, 아무 변화 없는 UpdateLayout 후에는 false 유지.
      할당 없는 Render: 기록하지 않는 빈 IDrawingContext로 두 번째 `UpdateLayout(같은 크기)` + `Render` 호출의 `GC.GetAllocatedBytesForCurrentThread()` 차이가 0.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Rendering*
      - unity/Packages/com.loonacia.xamlity/Core/Controls*
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIElement.cs
      - unity/Packages/com.loonacia.xamlity/Core/Tree/UIRoot.cs
      - dotnet/Xamlity.Core.Tests/Rendering/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

