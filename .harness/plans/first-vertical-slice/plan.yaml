  - id: s7-core-xaml-parser
    title: parse XAML into IR with file(line,col) errors
    type: feat
    scope: markup
    description: |
      먼저 읽을 파일: docs/PRD.md (핵심 기능 1, 2), docs/ADR.md (ADR-003, ADR-004), docs/ARCHITECTURE.md (`Markup` 영역, 데이터 흐름 > 에디터: 임포트,
      횡단 관심사 > 에러 처리), unity/Packages/com.loonacia.xamlity/Core/ 전체(어떤 타입과 DP가 있는지).

      namespace `Xamlity.Markup` (Core/Markup/)에 XAML 텍스트 → IR 파서를 만든다. 런타임 빌더와 직렬화는 다음 스텝(s8)이다.
      1. `ContentPropertyAttribute(string name)` (AttributeUsage Class, Inherited true). Border에 `[ContentProperty("Child")]`, Panel에
         `[ContentProperty("Children")]`을 붙인다. TextBlock에는 붙이지 않는다(WPF의 content property는 Inlines이고 Inlines는 범위 밖).
      2. IR (Core/Markup/XamlDocument.cs 등): `XamlDocument { XamlObjectNode Root }`;
         `XamlObjectNode { string TypeName; string Name (x:Name, 없으면 null); int Line; int Column; List<XamlPropertyNode> Properties }`.
         TypeName은 `"<CLR 전체 이름>, <어셈블리 이름>"` 형식이다(예: `Xamlity.Controls.Border, Xamlity.Core`). 이유: 런타임에서 `Type.GetType`으로
         바로 찾을 수 있고, 다음 계획의 사용자 타입(clr-namespace)도 같은 형식을 쓴다.
         `XamlPropertyNode { string PropertyName; int Line; int Column; string TextValue; List<XamlObjectNode> Objects }` — 속성 값이면 TextValue,
         content 자식이면 Objects. 값은 변환하지 않은 원문 문자열로 저장한다(검증만 파서에서 한다). 이유: IR 형식을 단순하게 유지하고 변환기는
         빌더가 다시 쓴다.
      3. `public sealed class XamlError { string File; int Line; int Column; string Message; override string ToString() => $"{File}({Line},{Column}): {Message}"; }`
         Line/Column은 1부터 시작한다.
      4. `public static class XamlParser { public static XamlParseResult Parse(string text, string fileName); }`,
         `XamlParseResult { XamlDocument Document (오류가 하나라도 있으면 null); IReadOnlyList<XamlError> Errors }`.
         System.Xml의 XmlReader(DtdProcessing.Prohibit)와 IXmlLineInfo로 줄·열을 얻는다. XML 문법 오류(XmlException)는 그 위치로 하나만 보고하고 멈춘다.
         타입·프로퍼티·값 오류는 계속 진행하며 모두 모은다.
      5. 타입 해석(internal, 예: XamlTypeResolver): 기본 xmlns `https://github.com/loonacia/xamlity` → Xamlity.Core 어셈블리의 `Xamlity.Controls`,
         `Xamlity.Layout` 네임스페이스에 있는 public, 비추상, UIElement 파생, 매개변수 없는 public 생성자가 있는 타입. x: 네임스페이스
         `http://schemas.microsoft.com/winfx/2006/xaml`는 `x:Name` 속성만 지원한다.
         오류로 보고할 것(조용히 무시하지 마라. 이유: ADR-004): 알 수 없는 요소, 다른 xmlns(clr-namespace 포함 — 다음 계획), x:Name 외 x: 지시어,
         알 수 없는 속성, `Owner.Property` 형식의 첨부 속성, `<Type.Property>` 프로퍼티 요소(다음 계획), 같은 프로퍼티 중복 설정,
         content property가 없는 타입의 자식 요소, 단일 값 content property(Border.Child)에 자식 두 개 이상, 공백이 아닌 텍스트 콘텐츠.
         xmlns 선언 속성은 오류가 아니다.
      6. 프로퍼티 해석: 속성 이름 → `DependencyProperty.FromName(type, name)`, 없으면 public 인스턴스 쓰기 가능 CLR 프로퍼티.
         값 검증(internal 변환기, 예: XamlValueConverter `bool TryConvert(string text, Type targetType, DependencyProperty dp, out object value, out string error)`):
         string; double(InvariantCulture, "Auto"는 WidthProperty/HeightProperty에서만 NaN, 단위 접미사는 오류); int; bool; enum(대소문자 무시, WPF EnumConverter와 같음);
         Thickness("a" / "a,b" / "a,b,c,d", 쉼표나 공백 구분, WPF ThicknessConverter와 같음); Brush("#RGB", "#ARGB", "#RRGGBB", "#AARRGGBB",
         WPF Colors의 이름 있는 색 전체, 대소문자 무시 → SolidColorBrush). 변환할 수 없는 타입(예: UIElement를 속성 문자열로)은 오류.
         빌더(s8)도 같은 변환기를 쓰므로 파싱과 변환을 분리해 둔다.
      런타임(Xamlity.Unity)에서 쓰일 코드가 아니다. Unity 쪽 코드를 건드리지 마라. 이유: ADR-003, 런타임은 IR만 읽는다.
      마크업 확장({Binding} 등), x:Class, x:Key, x:Type, 리소스는 만들지 마라. 이유: 다음 계획 범위다.

      테스트 dotnet/Xamlity.Core.Tests/Markup/XamlParserTests.cs: 정상 문서의 IR 구조(TypeName, 속성 원문, content 자식 순서, x:Name, 줄·열),
      위 오류 항목 각각에 대해 메시지와 정확한 줄·열, 여러 오류를 한 번에 모으기, `ToString()` 형식, 각 변환기 입력(정상·오류)을 검증한다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup*
      - unity/Packages/com.loonacia.xamlity/Core/Controls/Border.cs
      - unity/Packages/com.loonacia.xamlity/Core/Layout/Panel.cs
      - dotnet/Xamlity.Core.Tests/Markup/*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s8-core-ir-builder
    title: serialize IR to bytes and build element trees from it
    type: feat
    scope: markup
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-003), docs/ARCHITECTURE.md (`Markup` 영역, 데이터 흐름 > 런타임: 생성, 미정 사항),
      unity/Packages/com.loonacia.xamlity/Core/Markup/*.cs (s7의 IR, 변환기), dotnet/Xamlity.Core.Tests/Markup/XamlParserTests.cs.

      1. `public static class XamlIrSerializer { byte[] Serialize(XamlDocument document); XamlDocument Deserialize(byte[] data); }` (Core/Markup/).
         BinaryWriter/BinaryReader(UTF-8)를 쓴다. 헤더: 매직 4바이트 `XAIR` + int32 포맷 버전 1. 매직이 다르거나 버전이 다르거나 데이터가 잘리면
         `InvalidDataException`(메시지에 기대·실제 버전). IR의 모든 필드(TypeName, Name, Line, Column, 프로퍼티 노드의 TextValue/Objects)를 왕복한다.
      2. `public static class XamlBuilder { object Build(XamlDocument document); }`: 노드마다 `Type.GetType(TypeName, throwOnError: true)`(타입 캐시)와
         매개변수 없는 생성자로 객체를 만들고, 프로퍼티 노드를 문서 순서대로 적용한다. DP는 s7 변환기로 변환해 SetValue, CLR 프로퍼티는
         PropertyInfo.SetValue(PropertyInfo 캐시), content가 컬렉션(Children)이면 Add, 단일(Child)이면 대입. x:Name은 FrameworkElement.Name에 넣는다.
         변환 실패 등 예상 밖 상황은 `XamlBuildException`(줄·열 포함)으로 던진다. 정상 경로에서는 일어나지 않는다(파서가 이미 검증함).
         Reflection.Emit이나 런타임 코드 생성을 쓰지 마라. 이유: ADR-012, IL2CPP에서 지원되지 않는다. XAML 텍스트를 받는 Build 오버로드를 만들지 마라.
         이유: ADR-003, 런타임은 IR만 읽는다.
      3. docs/ARCHITECTURE.md: "미정 사항"에서 "IR 직렬화 형식" 항목을 지우고, `Markup` 설명 근처에 결정된 형식(헤더, 필드 순서, 값은 원문 문자열이며
         빌더가 변환, 버전을 올려야 하는 경우)을 짧게 적는다.

      테스트 dotnet/Xamlity.Core.Tests/Markup/XamlBuilderTests.cs: 직렬화 왕복 후 IR이 같음, 잘못된 매직·버전·잘린 데이터 예외, 그리고 끝에서 끝까지:
      XAML 텍스트(StackPanel 안에 Background·BorderBrush·BorderThickness·Padding이 있는 Border와 그 안 TextBlock, x:Name) → Parse → Serialize → Deserialize →
      Build → UIRoot(가짜 measurer) UpdateLayout(예: 400x300) → RecordingDrawingContext로 Render → 기대한 사각형·글리프 런 명령과 절대 좌표.
      s5·s6 테스트의 RecordingDrawingContext·FakeTextMeasurer를 재사용하고 복사하지 마라.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Core/Markup*
      - dotnet/Xamlity.Core.Tests/Markup/*
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s9-unity-xaml-importer
    title: import .xaml files into XamlAsset with ScriptedImporter
    type: feat
    scope: editor
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-003, ADR-011의 OnImportAsset 금지 사항), docs/ARCHITECTURE.md (레이어 규칙, 데이터 흐름 > 에디터: 임포트),
      unity/Packages/com.loonacia.xamlity/Core/Markup/*.cs, Tests/Editor/CoreAssemblyTests.cs (Unity 테스트 스타일).

      1. Runtime/XamlAsset.cs (namespace `Xamlity.Unity`): `public sealed class XamlAsset : ScriptableObject`, `[SerializeField] byte[] ir`.
         `internal void Initialize(byte[] ir)`, `internal bool HasIr`, `public UIElement Build()` (IR을 XamlIrSerializer로 읽고 XamlBuilder로 만든다.
         역직렬화한 XamlDocument는 캐시해도 된다). IR이 없으면(임포트 오류) `InvalidOperationException`("... has import errors" 류의 메시지와 에셋 이름).
         Object 참조 테이블은 아직 만들지 마라. 이유: Image가 다음 계획에서 처음 에셋을 참조한다.
      2. Editor/XamlImporter.cs (namespace `Xamlity.Editor`): `[ScriptedImporter(1, "xaml")] public sealed class XamlImporter : ScriptedImporter`.
         OnImportAsset: 파일을 UTF-8로 읽어 `XamlParser.Parse(text, ctx.assetPath)`. 오류마다 `ctx.LogImportError(error.ToString())` — 형식은
         `Assets/UI/Main.xaml(3,5): message`. 오류가 있어도 IR 없는 XamlAsset을 메인 오브젝트로 넣는다. 이유: 이 에셋을 참조하는 쪽의 참조가 끊기지 않게 한다.
         정상이면 `XamlIrSerializer.Serialize` 결과를 넣는다. OnImportAsset 안에서 파일을 쓰거나 AssetDatabase.CreateAsset/ImportAsset을 부르지 마라.
         이유: ADR-011, import가 재시작되거나 막힌다.
      3. 테스트(Tests/Editor/XamlImporterTests.cs):
         - 정상 픽스처 Tests/Editor/TestAssets/Valid.xaml(Border 안 TextBlock): `AssetDatabase.LoadAssetAtPath<XamlAsset>("Packages/com.loonacia.xamlity/Tests/Editor/TestAssets/Valid.xaml")`가
           null이 아니고 HasIr이며 Build()가 Border를 돌려준다.
         - 오류: 깨진 XAML을 패키지에 픽스처로 두지 마라. 이유: 프로젝트를 열 때마다 임포트 오류가 난다. 테스트가 `Assets/XamlityTestTemp/` 아래에
           임시 파일을 쓰고 `AssetDatabase.ImportAsset`한 뒤, 줄·열이 들어간 `Broken.xaml(줄,열): ` 형식의 오류가 났음을 검증하고(LogAssert.Expect 등,
           실제 동작을 확인해 맞는 방법을 쓴다), 에셋이 HasIr false이며 Build()가 예외를 던짐을 확인한다. TearDown에서 임시 폴더를 AssetDatabase.DeleteAsset으로 지운다.
      테스트를 Ignore하거나 기대값을 느슨하게 만들어 통과시키지 마라. Unity 쪽에서 XAML 텍스트를 런타임에 파싱하는 경로를 만들지 마라(ADR-003).
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlAsset.cs*
      - unity/Packages/com.loonacia.xamlity/Editor/XamlImporter.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/XamlImporterTests.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/TestAssets*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s10-unity-tmp-measurer
    title: measure Korean text with standalone TMP_FontAsset glyph data
    type: feat
    scope: unity
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-001, ADR-010 — 이 스텝이 ADR-010의 "첫 텍스트 Unity 스텝" 검증이다), docs/ARCHITECTURE.md (레이어 규칙),
      unity/Packages/com.loonacia.xamlity/Core/Rendering/ITextMeasurer.cs, FontHandle.cs, FontMetrics.cs, GlyphMetrics.cs, Core/Controls/TextBlock.cs.

      1. Runtime/TmpTextMeasurer.cs (namespace `Xamlity.Unity`): `internal sealed class TmpTextMeasurer : ITextMeasurer`. FontHandle.Source는 `TMP_FontAsset`이다.
         - GetFontMetrics: `faceInfo`의 ascentLine, descentLine(양수로), lineHeight를 `fontSize / faceInfo.pointSize`(및 faceInfo.scale)로 스케일한 픽셀 값.
         - TryGetGlyph: `characterLookupTable`에서 찾고, 없고 atlasPopulationMode가 Dynamic이면 `TryAddCharacters`로 한 번 추가를 시도한다.
           여전히 없으면 false. GlyphIndex = glyph.index, AdvanceWidth = glyph.metrics.horizontalAdvance를 같은 비율(및 glyph.scale)로 스케일.
           폴백 폰트(fallbackFontAssetTable)는 보지 않는다. 이유: GlyphRun이 폰트 하나만 가지며 폴백은 다음 계획이다.
         - 이미 있는 글리프 조회는 GC 할당이 없어야 한다. 없는 글자를 추가할 때만 할당을 허용한다.
         `TMP_Text`나 TextMeshPro 컴포넌트를 쓰지 마라. 자체 래스터라이저나 BMFont 경로를 만들지 마라. 이유: ADR-001, ADR-010.
      2. 테스트 Tests/Editor/TmpTextMeasurerTests.cs: 샘플 프로젝트의 `Assets/Fonts/NotoSansKR-Regular.otf`(OFL, 이미 저장소에 있음)를
         `AssetDatabase.LoadAssetAtPath<Font>`로 읽어 `TMP_FontAsset.CreateFontAsset(font, 90, 9, GlyphRenderMode.SDFAA, 1024, 1024, AtlasPopulationMode.Dynamic, true)`로
         메모리에 동적 폰트 에셋을 만든다(파일로 저장하지 마라). 검증: '한', '글', 'A'의 TryGetGlyph가 true이고 advance > 0, 호출 뒤
         characterLookupTable에 들어 있음, `atlasTextures[0]`이 null이 아니고 크기가 0보다 큼, GetFontMetrics의 Ascent·LineHeight > 0이고 fontSize에 비례,
         폰트에 없는 코드 포인트(예: U+E000)는 false. 이미 추가된 글자의 TryGetGlyph는 `Is.Not.AllocatingGCMemory()`.
         TearDown에서 만든 폰트 에셋, 아틀라스 텍스처, 머티리얼을 DestroyImmediate한다.
         이 테스트는 패키지 밖(샘플 Assets)의 폰트에 의존한다. 개발 저장소 전용 테스트임을 테스트 클래스 주석 한 줄로 남긴다.
      CreateFontAsset이 TMP Essential Resources(TMP Settings, 셰이더)를 요구해 실패하면, ugui 패키지에 들어 있는 TMP Essential Resources unitypackage를
      샘플 프로젝트에 임포트하고(unity/Assets/TextMesh Pro/ 아래에 생김, 네트워크 불필요) decisions에 적는다.
      TMP_FontAsset을 단독으로 써서 한글 동적 글리프 추가나 아틀라스 조회가 안 되면 우회 구현을 하지 말고 blockers에 적는다. 이유: ADR-010의 전제가
      깨지면 사람이 설계를 다시 정해야 한다.
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Runtime/TmpTextMeasurer.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/TmpTextMeasurerTests.cs*
      - unity/Assets/TextMesh Pro*
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s11-unity-render-rects
    title: draw Border rectangles via URP renderer feature at AfterRendering
    type: feat
    scope: unity
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-001, ADR-009), docs/ARCHITECTURE.md (레이어 규칙, 데이터 흐름 > 런타임: 매 프레임, 횡단 관심사 > 좌표와 해상도·성능, 미정 사항),
      unity/Packages/com.loonacia.xamlity/Core/Tree/UIRoot.cs, Core/Rendering/IDrawingContext.cs, Runtime/XamlAsset.cs, Runtime/TmpTextMeasurer.cs,
      unity/Assets/Settings/PC_Renderer.asset, Mobile_Renderer.asset, unity/ProjectSettings/QualitySettings.asset (Standalone 기본 품질은 PC).

      namespace `Xamlity.Unity` (Runtime/)에 만든다.
      1. `MeshDrawingContext : IDrawingContext` (internal): DrawRectangle을 사각형 하나당 정점 4개·인덱스 6개로 바꾼다. 위치는 픽셀 단위이고
         y는 뒤집는다(unityY = viewportHeight − y). 색은 SolidColorBrush.Color → Color32. 그리기 순서를 지키며, 연속된 같은 머티리얼·텍스처 명령을
         하나의 배치(submesh)로 묶는다. 정점 버퍼는 재사용 List로 채워 `Mesh.SetVertices(List<>)` 류를 써서 재생성 때도 불필요한 할당을 줄인다.
         DrawGlyphRun은 다음 스텝(s12)에서 구현하므로 지금은 아무것도 그리지 않는다.
      2. 셰이더 Runtime/Shaders/XamlitySolid.shader (`Xamlity/Solid`): 정점 색 unlit, `Blend SrcAlpha OneMinusSrcAlpha`, `ZTest Always`, `ZWrite Off`, `Cull Off`.
      3. `XamlityRoot : MonoBehaviour`: `[SerializeField] XamlAsset xaml`. 수명주기: Awake에서 트리 빌드(`xaml.Build()`, `new UIRoot(element, measurer: TmpTextMeasurer,
         defaultFont: default)` — 기본 폰트 연결은 s13), OnEnable/OnDisable에서 활성 루트 목록 등록·해제, LateUpdate에서 `Refresh(Screen.width, Screen.height)`.
         `internal void Refresh(int pixelWidth, int pixelHeight)`: UIRoot.UpdateLayout(픽셀 크기 = 논리 크기, 배율은 다음 계획) 후 IsRenderDirty일 때만 메시 재생성.
         EditMode 테스트에서는 Awake/OnEnable/LateUpdate가 불리지 않으므로 빌드·등록·해제를 테스트가 부를 수 있는 internal 메서드로 분리한다.
         `[ExecuteAlways]`를 붙이지 마라. 이유: 편집 모드 렌더링은 범위 밖이고 핫리로드 수명주기를 복잡하게 만든다. sortingOrder, 기준 해상도 필드는
         만들지 마라. 이유: 다음 계획의 화면 호스팅 스텝이다.
      4. `XamlityRendererFeature : ScriptableRendererFeature` + 내부 `ScriptableRenderPass`: `renderPassEvent = RenderPassEvent.AfterRendering`,
         `RecordRenderGraph(RenderGraph, ContextContainer)`만 구현한다. UniversalCameraData의 cameraType이 `CameraType.Game`이고 `resolveFinalTarget`이
         true일 때만 그린다. `resourceData.activeColorTexture`에 raster pass로 활성 루트들의 메시를 등록 순서대로 그린다. 픽셀 좌표 → 클립 공간은 직교 투영으로 하되,
         back buffer와 RenderTexture에서 y 방향이 같도록 `GL.GetGPUProjectionMatrix`나 `SetViewProjectionMatrices`로 처리한다(하드코딩한 플랫폼 flip 금지).
         셰이더는 피처의 직렬화 필드로 참조한다. 이유: Shader.Find만 쓰면 빌드에서 셰이더가 빠진다. Compatibility Mode `Execute` 경로,
         `URP_COMPATIBILITY_MODE` 분기, Built-in/HDRP 코드를 만들지 마라. 이유: ADR-009.
      5. 샘플 렌더러 unity/Assets/Settings/PC_Renderer.asset과 Mobile_Renderer.asset에 XamlityRendererFeature를 추가한다(셰이더 필드 연결 포함).
         YAML을 직접 고치거나 일회성 batchmode 스크립트를 써도 되지만, 그 스크립트는 커밋하지 말고 지운다.
      6. docs/ARCHITECTURE.md "미정 사항"에서 "메시 배치 단위와 셰이더 구성"을 지우고 결정(루트당 Mesh 하나, 연속한 같은 머티리얼·텍스처 명령을 submesh 배치,
         단색은 Xamlity/Solid, 텍스트는 s12의 SDF 셰이더)을 레이어 규칙이나 횡단 관심사 근처에 짧게 적는다.
      테스트(Tests/Editor/RenderingTests.cs, 픽스처 Tests/Editor/TestAssets/TopBand.xaml: `<Border Background="Red" Height="64" VerticalAlignment="Top"/>`):
         - MeshDrawingContext 단위 테스트: 사각형 하나의 정점 위치(y 뒤집힘)와 색, 같은 머티리얼 연속 명령이 배치 하나로 묶임.
         - 픽셀 테스트: 256x128 RenderTexture를 targetTexture로 가진 Game 카메라(배경 단색 검정), 픽스처로 XamlityRoot 빌드·등록 → Refresh(256,128) →
           카메라 렌더(`camera.Render()` 또는 `RenderPipeline.SubmitRenderRequest`) → ReadPixels. 위쪽 절반(텍스처 좌표 y > 64)의 픽셀은 빨강, 아래쪽은 검정.
           활성 URP 렌더러에 XamlityRendererFeature가 없으면 명확한 메시지로 실패한다.
         - 변화 없는 두 번째 `Refresh(256,128)`는 메시를 다시 만들지 않고(내부 카운터) `Is.Not.AllocatingGCMemory()`.
         - 테스트가 만든 GameObject, RenderTexture는 TearDown에서 정리하고 활성 루트 목록에서 해제한다.
      batchmode에서 렌더링 자체가 되지 않으면(그래픽 디바이스 없음 등) 픽셀 테스트를 지우거나 Ignore하지 말고 blockers에 적는다.
      uGUI, UI Toolkit, EventSystems를 쓰지 마라(ADR-001).
    expected_files:
      - unity/Packages/com.loonacia.xamlity/Runtime/MeshDrawingContext.cs*
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlityRoot.cs*
      - unity/Packages/com.loonacia.xamlity/Runtime/XamlityRendererFeature.cs*
      - unity/Packages/com.loonacia.xamlity/Runtime/Shaders*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/RenderingTests.cs*
      - unity/Packages/com.loonacia.xamlity/Tests/Editor/TestAssets/TopBand.xaml*
      - unity/Assets/Settings/PC_Renderer.asset
      - unity/Assets/Settings/Mobile_Renderer.asset
      - docs/ARCHITECTURE.md
    ac:
      - dotnet test dotnet/Xamlity.Core.Tests
      - 'unity test unity --mode EditMode --timeout 900 --output "unity/Logs/editmode-results.xml" --non-interactive'

  - id: s12-unity-render-text
    title: draw TextBlock glyphs from TMP atlas with an SDF shader
    type: feat
    scope: unity
    timeout_sec: 2700
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-010), docs/ARCHITECTURE.md (s11에서 적은 배치·셰이더 결정), unity/Packages/com.loonacia.xamlity/Runtime/*.cs,
      Runtime/Shaders/XamlitySolid.shader, Tests/Editor/RenderingTests.cs, Tests/Editor/TmpTextMeasurerTests.cs, Core/Rendering/GlyphRun.cs.

      1. MeshDrawingContext.DrawGlyphRun 구현: 글리프마다 TMP 글리프(GlyphIndex로 `glyphLookupTable` 조회)의 metrics(bearing, 크기)와 glyphRect(atlasPadding 포함)로
         기준선 원점 + 누적 advance 위치에 쿼드를 만든다. UV는 `atlasTextures[glyph.atlasIndex]` 크기로 정규화, 색은 Foreground. 배치 키는 텍스트 머티리얼 + 아틀라스 텍스처.
         배치별 텍스처는 MaterialPropertyBlock으로 넘긴다(배치마다 머티리얼을 복제하지 마라. 이유: 할당과 머티리얼 누수).
      2. 셰이더 Runtime/Shaders/XamlityText.shader (`Xamlity/Text`): 아틀라스 알파의 SDF 값을 0.5 경계로 `fwidth` 기반 smoothstep 커버리지로 바꿔
         정점 색 알파에 곱한다. 블렌드·깊이 설정은 Xamlity/Solid와 같다. 피처의 직렬화 필드로 참조하고 샘플 렌더러 에셋 두 개에 연결한다.
      3. XamlityRoot: 테스트가 기본 폰트(TMP_FontAsset)를 넣어 빌드할 수 있는 internal 경로를 둔다. 설정 에셋에서 기본 폰트를 읽는 것은 s13이다.
      4. 동적 아틀라스는 측정 중 TryAddCharacters로 커질 수 있다. 메시는 같은 프레임의 레이아웃 뒤에 만들어지므로 UV는 그 시점 아틀라스 크기로 계산한다.
      테스트(RenderingTests.cs에 추가, 픽스처 Tests/Editor/TestAssets/KoreanText.xaml: 왼쪽 위에 `<TextBlock Text="한글" FontSize="48" Foreground="White"/>`):
         - s10 테스트처럼 샘플 폰트로 메모리 동적 폰트 에셋을 만들어 기본 폰트로 쓴다.
         - MeshDrawingContext 단위 테스트: 글리프 2개 → 정점 8개, UV가 [0,1] 범위, 배치 텍스처가 아틀라스.
         - 픽셀 테스트(256x128, 검정 배경): TextBlock의 RenderSize 영역 안에 밝은 픽셀(예: R > 128)이 일정 수 이상 있고, 그 영역 밖 오른쪽 아래는 모두 검정.
         - 변화 없는 두 번째 Refresh는 `Is.Not.AllocatingGCMemory()` (텍스트 포함).
      s11과 같이 렌더링이 batchmode에서 불가능하면 blockers에 적는다. 테스트를 지우거나 Ignore하지 마라.
      TextWrapping, TextAlignment, 폴백 폰트, 클립을 만들지 마라. 이유: 다음 계획 범위다.
